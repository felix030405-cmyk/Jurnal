<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe5ff">
<title>Self Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-a:#eaf8ff;--sky-b:#bfe6ff;--sky-c:#86c9f4;
  --card:rgba(255,255,255,.82);--card-solid:#ffffff;--glass:rgba(240,249,255,.78);
  --ink:#0a2744;--mut:#58768f;--line:rgba(24,92,160,.13);--line2:rgba(24,92,160,.28);
  --acc:#1779d4;--acc2:rgba(23,121,212,.12);--on-acc:#ffffff;--red:#ec4a5a;--ok:#0f9d7a;
  --sh:0 6px 22px -10px rgba(10,80,150,.35);
  --wave:rgba(255,255,255,.45);--blob1:rgba(255,255,255,.85);--blob2:rgba(80,190,255,.45);--blob3:rgba(0,200,200,.28);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --sky-a:#06203d;--sky-b:#07305a;--sky-c:#06445f;
    --card:rgba(12,40,70,.78);--card-solid:#0e2a48;--glass:rgba(7,32,60,.82);
    --ink:#e6f2ff;--mut:#8db1d6;--line:rgba(130,190,255,.16);--line2:rgba(130,190,255,.32);
    --acc:#5cb8ff;--acc2:rgba(92,184,255,.16);--on-acc:#04213f;--red:#ff7480;--ok:#38d3a9;
    --sh:0 6px 22px -10px rgba(0,0,0,.6);
    --wave:rgba(90,180,255,.13);--blob1:rgba(60,140,255,.28);--blob2:rgba(0,170,220,.25);--blob3:rgba(40,100,200,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  color:var(--ink);font:16px/1.5 var(--body);
  background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 48%,var(--sky-c) 100%) fixed;
  min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 120px}

/* Latar laut */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(55px)}
.bg i:nth-child(1){width:300px;height:300px;left:-90px;top:-60px;background:var(--blob1)}
.bg i:nth-child(2){width:340px;height:340px;right:-140px;top:36%;background:var(--blob2)}
.bg i:nth-child(3){width:280px;height:280px;left:-70px;bottom:6%;background:var(--blob3)}
.waves{position:absolute;left:0;bottom:0;width:200%;height:150px;opacity:1;animation:drift 38s linear infinite}
.waves.w2{height:110px;animation-duration:26s;animation-direction:reverse}
.waves path{fill:var(--wave)}
@keyframes drift{to{transform:translateX(-50%)}}

/* Beranda */
.hero{padding:calc(30px + env(safe-area-inset-top)) 2px 22px;position:relative}
.greet{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);padding:6px 14px 6px 8px;border-radius:30px;font-weight:600;font-size:14px;color:var(--mut);backdrop-filter:blur(8px)}
.greet svg{width:22px;height:22px}
.hero h1{margin:14px 0 4px;font:800 clamp(44px,13vw,58px)/.95 var(--display);letter-spacing:-.035em;color:var(--ink)}
.hero p{margin:0;color:var(--mut);font-weight:500}
.sun,.moon{position:absolute;right:-6px;top:calc(22px + env(safe-area-inset-top));width:104px;height:104px}
.moon{display:none}
@media (prefers-color-scheme:dark){.sun{display:none}.moon{display:block}}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;overflow:hidden;color:#fff;padding:16px 16px 15px;min-height:168px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 18px 30px -16px rgba(8,70,140,.65),inset 0 1px 0 rgba(255,255,255,.4)}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 0% 0%,rgba(255,255,255,.34),transparent 55%);pointer-events:none}
.tile .badge{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.35)}
.tile svg.ic{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .ghost{position:absolute;right:-30px;top:-14px;width:120px;height:120px;stroke:#fff;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.14}
.tile b{display:block;font:700 22px/1.1 var(--display);letter-spacing:-.01em}
.tile span.st{display:block;font-size:13px;font-weight:500;opacity:.92;margin-top:3px;line-height:1.3}
.tbar{height:5px;background:rgba(255,255,255,.28);border-radius:5px;margin-top:9px;overflow:hidden}
.tbar i{display:block;height:100%;background:#fff;border-radius:5px}
.t1{background:linear-gradient(150deg,#1f8fe8,#37c0f4);border-radius:30px 30px 30px 10px}
.t2{background:linear-gradient(150deg,#0a9ab3,#2fd0c4);border-radius:30px 10px 30px 30px}
.t3{background:linear-gradient(150deg,#2b4fb8,#5d86e6);border-radius:10px 30px 30px 30px}
.t4{background:linear-gradient(150deg,#47698c,#8fb4d6);border-radius:30px 30px 10px 30px}
.tile.soon{background:transparent;color:var(--mut);box-shadow:none;border:2px dashed var(--line2);align-items:center;justify-content:center;text-align:center;min-height:168px;border-radius:26px}
.tile.soon::after{display:none}
.tile.soon b{font-size:15px;font-weight:600;font-family:var(--body)}
.tile.soon .plus{font-size:30px;line-height:1;font-weight:300;margin-bottom:4px}
/* satu urutan muncul saat beranda dibuka */
.grid.enter .tile{animation:surf .7s cubic-bezier(.2,.8,.2,1) both}
.grid.enter .tile:nth-child(2){animation-delay:.08s}
.grid.enter .tile:nth-child(3){animation-delay:.16s}
.grid.enter .tile:nth-child(4){animation-delay:.24s}
.grid.enter .tile:nth-child(5){animation-delay:.32s}
.grid.enter .tile:nth-child(6){animation-delay:.4s}
@keyframes surf{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}

/* Bilah atas & tab */
.topbar{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;z-index:5;margin:0 -16px 6px;padding-left:16px;padding-right:16px;background:linear-gradient(180deg,var(--glass) 70%,transparent)}
.topbar h1{margin:0;font:700 21px/1 var(--display);text-align:center;letter-spacing:-.01em}
.back{font-size:30px;line-height:1;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--card);box-shadow:var(--sh)}
.tabs{display:flex;background:var(--card);border-radius:16px;padding:4px;box-shadow:var(--sh);margin-bottom:14px}
.tabs a{flex:1;text-align:center;padding:10px 0;border-radius:12px;font-weight:600;font-size:15px;color:var(--mut)}
.tabs a.on{background:var(--acc);color:var(--on-acc)}
.pagetitle{font:700 19px/1.2 var(--display);margin:4px 2px 12px}

/* Kartu & tabel */
.card{background:var(--card);backdrop-filter:blur(10px);border-radius:20px;padding:14px 14px 8px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--line)}
.sec-h{display:flex;align-items:center;justify-content:space-between;min-height:28px;margin-bottom:4px}
.sec-h h2{margin:0;font:700 17px/1.2 var(--display)}
.pct{font:700 16px var(--display);color:var(--acc)}
.bar{height:7px;border-radius:7px;background:var(--acc2);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#33c4e0);border-radius:7px;transition:width .35s}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;color:var(--mut);text-align:left;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:11px 4px;border-bottom:1px solid var(--line);vertical-align:middle;word-break:break-word}
tr:last-child td{border-bottom:0}
.n{width:28px;color:var(--mut)}.p{width:54px;color:var(--mut)}.c{width:40px;text-align:center}.tm{width:64px;color:var(--mut)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);vertical-align:middle}
tr.done td{opacity:.45;transition:opacity .2s}
tr.done td:not(.c){text-decoration:line-through}
.cal-ic{display:inline-flex;vertical-align:middle;color:var(--red);margin-left:4px}
.cal-ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dtxt{display:block;font-size:12px;color:var(--mut)}
.empty-msg{text-align:center;color:var(--mut);padding:40px 12px}

/* Manage */
.linkrow{display:flex;justify-content:flex-end;margin-bottom:10px}
.btn-soft{background:var(--acc2);color:var(--acc);font-weight:700;padding:9px 15px;border-radius:13px;font-size:14px}
.stitle{font:700 15px var(--display);color:var(--mut);margin:18px 4px 8px}
.tcard{background:var(--card);backdrop-filter:blur(10px);border-radius:18px;padding:12px 8px 12px 14px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--line);display:flex;align-items:center;gap:10px;position:relative}
.tcard .no{color:var(--mut);font-size:14px;width:20px}
.tinfo{flex:1;min-width:0}
.tt{word-break:break-word;font-weight:500}
.tmeta{font-size:12.5px;color:var(--mut);margin-top:2px}
.more{position:relative}
.more>button{width:38px;height:38px;font-size:22px;border-radius:50%;color:var(--mut)}
.dd{position:absolute;right:0;top:40px;background:var(--card-solid);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 30px rgba(0,30,70,.28);z-index:10;min-width:150px;overflow:hidden}
.dd button{display:block;width:100%;text-align:left;padding:12px 16px;font-size:15px}
.dd button.off{opacity:.35;pointer-events:none}
.dd button.del{color:var(--red)}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,#2a9bf0,#1769c8);color:#fff;font-size:34px;line-height:1;box-shadow:0 12px 24px -6px rgba(10,90,190,.6);z-index:20;display:flex;align-items:center;justify-content:center}
.overlay{position:fixed;inset:0;background:rgba(2,20,45,.5);z-index:30}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card-solid);border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;z-index:31}
.sheet h3{margin:0 0 14px;font:700 20px var(--display)}
.seg{display:flex;background:var(--acc2);border-radius:13px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.seg.lock{opacity:.7;pointer-events:none}
label.f{display:block;font-size:13.5px;font-weight:600;color:var(--mut);margin-bottom:12px}
label.f input{display:block;width:100%;margin-top:5px;padding:12px;border-radius:13px;border:1px solid var(--line2);background:var(--card-solid);color:var(--ink);font:500 16px var(--body)}
label.chk{display:flex;align-items:center;gap:10px;margin:4px 0 12px;font-size:15px}
.btn{display:block;width:100%;background:var(--acc);color:var(--on-acc);font-weight:700;padding:14px;border-radius:15px;margin-top:10px;text-align:center}
.btn.alt{background:var(--acc2);color:var(--acc)}
.btn[disabled]{opacity:.5;pointer-events:none}
.seldate{font-size:14px;color:var(--acc);font-weight:700;margin:6px 2px 10px}

/* Kalender mini */
.cal{background:transparent;border-radius:16px;padding:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h b{font:700 17px var(--display)}
.cal-h button{width:38px;height:38px;font-size:24px;border-radius:12px;background:var(--acc2);color:var(--acc)}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-w span{text-align:center;font-size:12px;color:var(--mut);padding:4px 0;font-weight:600}
.cell{position:relative;height:44px;margin:2px;border-radius:13px;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center}
.cell.empty{pointer-events:none}
.cell.today{border:1.5px solid var(--acc);color:var(--acc);font-weight:700}
.cell.sel{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.sheet .cal{background:var(--acc2)}
.calbox{background:var(--card);backdrop-filter:blur(10px);border-radius:22px;padding:6px;box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:14px}
.calbox .cal{padding:6px}

/* Detail kalender */
.drow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.drow span{flex:1;font-weight:500}
.drow button{width:34px;height:34px;font-size:20px;color:var(--mut);border-radius:50%}
.dl{list-style:none;margin:0;padding:6px 0 6px 6px;font-size:14px}
.dl li{padding:4px 0;display:flex;gap:8px}
.dl li.ok span{color:var(--ok)}.dl li.no span{color:var(--red)}
.dl li.no{color:var(--mut)}
.sub{font:700 13px var(--display);color:var(--mut);margin:12px 0 2px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .st{width:20px;text-align:center;color:var(--mut)}
.item.done{opacity:.5}.item.done .tx{text-decoration:line-through}
.item .tx{flex:1;word-break:break-word}
.item small{color:var(--mut)}
.diary{padding-bottom:14px;word-break:break-word}
.diary ul,.diary ol{margin:4px 0;padding-left:22px}
.none{color:var(--mut);font-size:14px;padding:6px 0 10px}

/* Jurnal */
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.datebar .nav{width:46px;height:46px;font-size:26px;background:var(--card);border-radius:15px;box-shadow:var(--sh);border:1px solid var(--line)}
.datebar .datebtn{flex:1;height:46px;background:var(--card);border-radius:15px;box-shadow:var(--sh);border:1px solid var(--line);font-weight:700;font-size:15px}
.datebtn small{color:var(--acc);font-weight:700}
.pop{margin-bottom:12px}
.paper{
  background-color:#fffefb;color:#23303d;
  background-image:
    linear-gradient(to right,transparent 44px,#f0b4b4 44px,#f0b4b4 45px,transparent 45px),
    repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#c9ddf2 31px,#c9ddf2 32px);
  background-attachment:local,local;
  border-radius:14px;box-shadow:var(--sh);
  min-height:calc(100vh - 330px);padding:0 14px 40px 58px;
  font-size:17px;line-height:32px;outline:none;word-break:break-word
}
.paper:empty:before{content:attr(data-ph);color:#9fb0c4;pointer-events:none}
.paper div,.paper p{margin:0}
.paper ul,.paper ol{margin:0;padding-left:26px}
.paper li{line-height:32px}
.jsave{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;background:linear-gradient(145deg,#2a9bf0,#1769c8);color:#fff;font-weight:700;padding:13px 24px;border-radius:30px;box-shadow:0 12px 24px -6px rgba(10,90,190,.6)}
.toolbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--card-solid);border-top:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));overflow-x:auto;z-index:20}
.toolbar button,.toolbar label,.toolbar select{flex:0 0 auto;min-width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--acc2);border:0;color:var(--ink)}
.toolbar select{padding:0 8px;font:600 14px var(--body)}
.toolbar .tb-c{position:relative;font-weight:700;overflow:hidden}
.toolbar .tb-c input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.toolbar .tb-c i{position:absolute;left:10px;right:10px;bottom:6px;height:3px;border-radius:2px;background:#d93025}

/* Pengaturan */
.set p{margin:0 0 12px;color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;margin-bottom:10px}
.row .btn,.row .btn-soft{margin-top:0;flex:1;padding:11px 8px;font-size:14px}
.stat{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-of-type{border-bottom:0}
.stat span:first-child{color:var(--mut)}
.msg{margin:12px 0 4px;padding:11px 13px;border-radius:14px;font-size:14px;word-break:break-word;white-space:pre-line}
.msg.ok{background:rgba(15,157,122,.14);color:var(--ok)}
.msg.err{background:rgba(236,74,90,.14);color:var(--red)}
.msg.info{background:var(--acc2);color:var(--acc)}
.hint{font-size:12.5px;color:var(--mut);margin:-4px 2px 12px}

.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%) translateY(20px);background:#0a2744;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){
  .waves{animation:none}
  .grid.enter .tile{animation:none}
  *{transition:none!important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <i></i><i></i><i></i>
  <svg class="waves w2" viewBox="0 0 1200 110" preserveAspectRatio="none"><path d="M0 50 C100 10 200 90 300 50 S500 10 600 50 S800 90 900 50 S1100 10 1200 50 V110 H0Z"/></svg>
  <svg class="waves" viewBox="0 0 1200 150" preserveAspectRatio="none"><path d="M0 70 C150 20 250 120 400 70 S650 20 800 70 S1050 120 1200 70 V150 H0Z"/></svg>
</div>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ---------- Util ---------- */
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HARI3=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const today=()=>dkey(new Date());
const isDateKey=k=>typeof k==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(k)&&dkey(parse(k))===k;
const longDate=k=>{const d=parse(k);return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear()};
const shortDate=k=>{const d=parse(k);return d.getDate()+' '+BULAN[d.getMonth()].slice(0,3)+' '+d.getFullYear()};
const stamp=iso=>{const d=new Date(iso);return isNaN(d)?'-':d.getDate()+' '+BULAN[d.getMonth()].slice(0,3)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const nowIso=()=>new Date().toISOString();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const app=document.getElementById('app');
const clean=o=>JSON.parse(JSON.stringify(o));

const ICON_CAL='<span class="cal-ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span>';

/* ---------- Sanitizer (data cloud tidak dipercaya) ---------- */
const OKTAG={B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,DIV:1,P:1,BR:1,SPAN:1};
const DROPTAG={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,NOSCRIPT:1,TEMPLATE:1,SVG:1,MATH:1,LINK:1,META:1,FORM:1,TEXTAREA:1,SELECT:1,BUTTON:1,INPUT:1,TITLE:1,HEAD:1};
function safeColor(c){
  if(!c)return '';
  return (/^#[0-9a-f]{3,8}$/i.test(c)||/^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}(\s*,\s*[\d.]+)?\s*\)$/i.test(c))?c:'';
}
function safeSize(s){
  const m=/^(\d{1,2})px$/.exec(s||'');
  return m&&+m[1]>=8&&+m[1]<=60?s:'';
}
function cleanNode(src,dst,depth){
  if(depth>40)return;
  src.childNodes.forEach(n=>{
    if(n.nodeType===3){dst.appendChild(document.createTextNode(n.nodeValue));return}
    if(n.nodeType!==1)return;
    const tag=n.tagName.toUpperCase();
    if(DROPTAG[tag])return;
    if(OKTAG[tag]){
      const el=document.createElement(tag.toLowerCase());
      if(tag==='SPAN'){
        const c=safeColor(n.style&&n.style.color),f=safeSize(n.style&&n.style.fontSize);
        if(c)el.style.color=c;
        if(f)el.style.fontSize=f;
      }
      if(tag!=='BR')cleanNode(n,el,depth+1);
      dst.appendChild(el);
    }else cleanNode(n,dst,depth+1);
  });
}
function sanitize(html){
  const doc=new DOMParser().parseFromString('<body>'+String(html==null?'':html).slice(0,900000),'text/html');
  const out=document.createElement('div');
  cleanNode(doc.body,out,0);
  return out.innerHTML;
}
function htmlTitle(html){
  const tmp=document.createElement('div');tmp.innerHTML=sanitize(html);
  for(const n of tmp.childNodes){
    const t=(n.textContent||'').trim();
    if(t)return t.slice(0,80);
  }
  return '';
}
function htmlEmpty(html){
  const tmp=document.createElement('div');tmp.innerHTML=sanitize(html);
  return !tmp.textContent.trim();
}

/* ---------- Data ---------- */
const KEY='selfjournal.v1';
const CODEKEY='jurnal.syncCode';
function blank(){
  return {tasks:[],checks:{},locked:{},completed:[],journals:{},lastDate:today(),seq:1,tasksUpdatedAt:null,
    sync:{entries:{},tasksSynced:null,lastSync:null}};
}
function migrate(raw){
  const S0=blank();
  if(!raw||typeof raw!=='object')return S0;
  S0.tasks=normTasks(raw.tasks);
  S0.checks=normChecks(raw.checks);
  S0.locked=normLocked(raw.locked);
  S0.completed=normCompleted(raw.completed);
  S0.lastDate=isDateKey(raw.lastDate)?raw.lastDate:today();
  const jn={};
  if(raw.journals&&typeof raw.journals==='object'){
    Object.keys(raw.journals).forEach(d=>{
      if(!isDateKey(d))return;
      const j=raw.journals[d];
      if(typeof j==='string'){
        if(!htmlEmpty(j))jn[d]={html:sanitize(j),createdAt:nowIso(),updatedAt:nowIso()};
      }else if(j&&typeof j==='object'){
        const ca=typeof j.createdAt==='string'?j.createdAt:nowIso();
        const ua=typeof j.updatedAt==='string'?j.updatedAt:ca;
        jn[d]=j.deleted?{html:'',deleted:true,createdAt:ca,updatedAt:ua}
          :{html:sanitize(typeof j.html==='string'?j.html:''),createdAt:ca,updatedAt:ua};
      }
    });
  }
  S0.journals=jn;
  let mx=Number(raw.seq)||1;
  S0.tasks.forEach(t=>{mx=Math.max(mx,t.id+1,t.order+1)});
  S0.completed.forEach(c=>{mx=Math.max(mx,c.id+1)});
  S0.seq=mx;
  S0.tasksUpdatedAt=typeof raw.tasksUpdatedAt==='string'?raw.tasksUpdatedAt:null;
  if(!S0.tasksUpdatedAt&&(S0.tasks.length||S0.completed.length||Object.keys(S0.locked).length))S0.tasksUpdatedAt=nowIso();
  const sy=raw.sync&&typeof raw.sync==='object'?raw.sync:{};
  S0.sync={entries:(sy.entries&&typeof sy.entries==='object')?sy.entries:{},tasksSynced:typeof sy.tasksSynced==='string'?sy.tasksSynced:null,lastSync:typeof sy.lastSync==='string'?sy.lastSync:null};
  return S0;
}
function str(v,max){return typeof v==='string'?v.slice(0,max):''}
function normTasks(a){
  if(!Array.isArray(a))return [];
  return a.filter(t=>t&&typeof t==='object'&&Number.isFinite(Number(t.id))).map(t=>{
    const o={id:Number(t.id),order:Number.isFinite(Number(t.order))?Number(t.order):Number(t.id),
      type:t.type==='daily'?'daily':'biasa',text:str(t.text,200),points:str(t.points==null?'':String(t.points),20),
      date:isDateKey(t.date)?t.date:null,created:isDateKey(t.created)?t.created:today(),done:!!t.done};
    if(o.done&&isDateKey(t.doneDate))o.doneDate=t.doneDate;
    return o;
  });
}
function normChecks(o){
  const r={};
  if(o&&typeof o==='object')Object.keys(o).forEach(k=>{
    if(isDateKey(k)&&Array.isArray(o[k]))r[k]=o[k].map(Number).filter(Number.isFinite);
  });
  return r;
}
function normLocked(o){
  const r={};
  if(o&&typeof o==='object')Object.keys(o).forEach(k=>{
    if(isDateKey(k)&&Array.isArray(o[k]))r[k]=o[k].filter(i=>i&&typeof i==='object').map(i=>({text:str(i.text,200),points:str(i.points==null?'':String(i.points),20),done:!!i.done}));
  });
  return r;
}
function normCompleted(a){
  if(!Array.isArray(a))return [];
  return a.filter(c=>c&&typeof c==='object'&&isDateKey(c.date)&&Number.isFinite(Number(c.id))).map(c=>({
    id:Number(c.id),taskId:Number(c.taskId)||0,text:str(c.text,200),points:str(c.points==null?'':String(c.points),20),
    date:c.date,time:/^\d{2}:\d{2}$/.test(c.time)?c.time:'00:00',attach:isDateKey(c.attach)?c.attach:null
  }));
}
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object')return migrate(r)}catch(e){}
  return blank();
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Gagal menyimpan data di browser')}}
const touch=()=>{S.tasksUpdatedAt=nowIso()};
const uid=()=>S.seq++;
const byOrder=(a,b)=>a.order-b.order;
const dailyTasks=()=>S.tasks.filter(t=>t.type==='daily').sort(byOrder);
const getJ=d=>{const j=S.journals[d];return j&&!j.deleted&&j.html?j:null};

function secOf(t){
  if(t.type==='daily')return 'daily';
  if(t.date&&t.date>today())return 'dated';
  return 'biasa';
}
function isDone(t){
  if(t.type==='daily')return (S.checks[today()]||[]).indexOf(t.id)>=0;
  return !!t.done;
}

/* Kunci daily setiap ganti hari + bersihkan task selesai hari lalu */
function rollover(){
  const td=today();let changed=false;
  if(S.lastDate<td){
    const d=parse(S.lastDate),end=parse(td);let guard=0;
    while(d<end&&guard++<4000){
      const k=dkey(d);
      const ch=S.checks[k]||[];
      const items=dailyTasks().filter(t=>t.created<=k).map(t=>({text:t.text,points:t.points,done:ch.indexOf(t.id)>=0}));
      if(items.length)S.locked[k]=items;
      delete S.checks[k];
      d.setDate(d.getDate()+1);
    }
    S.lastDate=td;changed=true;
  }
  const n=S.tasks.length;
  S.tasks=S.tasks.filter(t=>!(t.done&&t.doneDate&&t.doneDate<td));
  if(S.tasks.length!==n)changed=true;
  if(changed){touch();save()}
  return changed;
}

function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const td=today();
  if(t.type==='daily'){
    const a=S.checks[td]||(S.checks[td]=[]);
    const i=a.indexOf(id);
    if(i>=0)a.splice(i,1);else a.push(id);
  }else if(t.done){
    t.done=false;delete t.doneDate;
    S.completed=S.completed.filter(c=>c.taskId!==id);
  }else{
    const n=new Date();
    t.done=true;t.doneDate=td;
    S.completed.push({id:uid(),taskId:id,text:t.text,points:t.points,date:td,time:pad(n.getHours())+':'+pad(n.getMinutes()),attach:t.date||null});
  }
  touch();save();render();
}

function cloudEntries(snap){
  const map={};
  snap.forEach(function(d){
    const id=d.id;if(!isDateKey(id))return;
    const v=d.data();if(!v||typeof v!=='object')return;
    map[id]=v;
  });
  return map;
}
async function syncUp(){
  const code=readCode();
  const x=await fb(),db=x.db,F=x.F;
  const res=await Promise.all([F.getDocs(F.collection(db,'jurnalApp',code,'entries')),F.getDoc(F.doc(db,'jurnalApp',code))]);
  const cloud=cloudEntries(res[0]);
  const rootData=res[1].exists()?res[1].data():null;
  const dates=Object.keys(S.journals).sort();
  const todo=[],conflicts=[];
  dates.forEach(function(d){
    const j=S.journals[d],synced=S.sync.entries[d],c=cloud[d];
    if(j.updatedAt===synced)return;
    if(c&&c.updatedAt===j.updatedAt){S.sync.entries[d]=j.updatedAt;return}
    if(j.deleted&&!c&&!synced){S.sync.entries[d]=j.updatedAt;return}
    if(c&&c.updatedAt!==synced)conflicts.push(d);
    todo.push(d);
  });
  let skip=[];
  if(conflicts.length&&!confirm('Entri di cloud berbeda dari catatan terakhir perangkat ini untuk:\n'+conflicts.map(shortDate).join(', ')+'\n\nTimpa dengan versi perangkat ini?'))skip=conflicts;
  let sent=0;
  for(const d of todo){
    if(skip.indexOf(d)>=0)continue;
    const j=S.journals[d],c=cloud[d]||{};
    const data=clean({
      title:j.deleted?'':htmlTitle(j.html),
      text:j.deleted?'':sanitize(j.html),
      mood:typeof c.mood==='string'?c.mood:'',
      tags:Array.isArray(c.tags)?c.tags.filter(function(t){return typeof t==='string'}):[],
      createdAt:j.createdAt,updatedAt:j.updatedAt,deleted:!!j.deleted
    });
    if(JSON.stringify(data).length>900000)throw new Error('Jurnal '+shortDate(d)+' terlalu besar untuk satu dokumen (batas 1 MiB).');
    await F.setDoc(F.doc(db,'jurnalApp',code,'entries',d),data);
    S.sync.entries[d]=j.updatedAt;save();sent++;
  }
  let tasksSent=false,tasksMsg='';
  const cb=rootData&&rootData.pengaturan&&rootData.pengaturan.app==='journal'?rootData.pengaturan:null;
  if(S.tasksUpdatedAt&&S.tasksUpdatedAt!==S.sync.tasksSynced){
    let go=true;
    if(cb&&cb.tasksUpdatedAt===S.tasksUpdatedAt)S.sync.tasksSynced=S.tasksUpdatedAt,go=false;
    else if(cb&&cb.tasksUpdatedAt!==S.sync.tasksSynced){
      go=confirm('Task di cloud berbeda dari catatan terakhir perangkat ini (cloud diubah '+stamp(cb.tasksUpdatedAt)+').\n\nTimpa dengan task perangkat ini?');
      if(!go)tasksMsg=' Task dilewati.';
    }
    if(go){
      const blk=clean({app:'journal',v:1,tasksUpdatedAt:S.tasksUpdatedAt,data:{tasks:S.tasks,checks:S.checks,locked:S.locked,completed:S.completed,seq:S.seq,lastDate:S.lastDate}});
      if(JSON.stringify(blk).length>900000)throw new Error('Data task terlalu besar untuk satu dokumen (batas 1 MiB).');
      await F.setDoc(F.doc(db,'jurnalApp',code),{pengaturan:blk,updatedAt:nowIso()},{mergeFields:['pengaturan','updatedAt']});
      S.sync.tasksSynced=S.tasksUpdatedAt;tasksSent=true;
    }
  }
  S.sync.lastSync=nowIso();save();
  const skipped=skip.length?' '+skip.length+' jurnal dilewati.':'';
  return 'Upload selesai: '+sent+' jurnal'+(tasksSent?' dan data task':'')+' terkirim.'+skipped+tasksMsg;
}
async function syncDown(){
  const code=readCode();
  const x=await fb(),db=x.db,F=x.F;
  const res=await Promise.all([F.getDocs(F.collection(db,'jurnalApp',code,'entries')),F.getDoc(F.doc(db,'jurnalApp',code))]);
  const cloud=cloudEntries(res[0]);
  const rootData=res[1].exists()?res[1].data():null;
  const apply=[],conflicts=[];
  Object.keys(cloud).sort().forEach(function(d){
    const c=cloud[d];
    if(typeof c.updatedAt!=='string')return;
    const synced=S.sync.entries[d],l=S.journals[d];
    if(c.updatedAt===synced)return;
    if(l&&l.updatedAt===c.updatedAt){S.sync.entries[d]=c.updatedAt;return}
    const localChanged=l&&l.updatedAt!==synced;
    if(localChanged)conflicts.push(d);
    apply.push(d);
  });
  let skip=[];
  if(conflicts.length&&!confirm('Jurnal berikut berubah di perangkat ini dan di cloud:\n'+conflicts.map(shortDate).join(', ')+'\n\nPakai versi cloud?'))skip=conflicts;
  let got=0;
  apply.forEach(function(d){
    if(skip.indexOf(d)>=0)return;
    const c=cloud[d];
    const ca=typeof c.createdAt==='string'?c.createdAt:c.updatedAt;
    if(c.deleted===true||typeof c.text!=='string'||htmlEmpty(c.text)){
      S.journals[d]={html:'',deleted:true,createdAt:ca,updatedAt:c.updatedAt};
    }else{
      S.journals[d]={html:sanitize(c.text),createdAt:ca,updatedAt:c.updatedAt};
    }
    S.sync.entries[d]=c.updatedAt;got++;
  });
  let tasksGot=false,tasksMsg='';
  const cb=rootData&&rootData.pengaturan&&rootData.pengaturan.app==='journal'&&rootData.pengaturan.data&&typeof rootData.pengaturan.data==='object'?rootData.pengaturan:null;
  if(cb&&typeof cb.tasksUpdatedAt==='string'&&cb.tasksUpdatedAt!==S.sync.tasksSynced&&cb.tasksUpdatedAt!==S.tasksUpdatedAt){
    const localHas=S.tasks.length||S.completed.length||Object.keys(S.locked).length;
    const localChanged=S.tasksUpdatedAt&&S.tasksUpdatedAt!==S.sync.tasksSynced;
    let go=true;
    if(localHas&&localChanged){
      go=confirm('Task di perangkat ini juga berubah sejak sinkron terakhir (cloud diubah '+stamp(cb.tasksUpdatedAt)+').\n\nGanti dengan task dari cloud?');
      if(!go)tasksMsg=' Task dilewati.';
    }
    if(go){
      const d=cb.data;
      S.tasks=normTasks(d.tasks);S.checks=normChecks(d.checks);S.locked=normLocked(d.locked);S.completed=normCompleted(d.completed);
      let mx=Number(d.seq)||1;
      S.tasks.forEach(function(t){mx=Math.max(mx,t.id+1,t.order+1)});
      S.completed.forEach(function(c){mx=Math.max(mx,c.id+1)});
      S.seq=mx;
      S.lastDate=(isDateKey(d.lastDate)&&d.lastDate<=today())?d.lastDate:today();
      S.tasksUpdatedAt=cb.tasksUpdatedAt;S.sync.tasksSynced=cb.tasksUpdatedAt;
      tasksGot=true;
    }
  }else if(cb&&cb.tasksUpdatedAt===S.tasksUpdatedAt){S.sync.tasksSynced=cb.tasksUpdatedAt}
  S.sync.lastSync=nowIso();save();
  if(tasksGot)rollover();
  const skipped=skip.length?' '+skip.length+' jurnal dilewati.':'';
  return 'Ambil selesai: '+got+' jurnal'+(tasksGot?' dan data task':'')+' diperbarui.'+skipped+tasksMsg;
}

function doImport(file){

      if(!p||p.app!=='journal'||!p.data)throw new Error('Bukan file backup Jurnal.');
      if(!confirm('Import akan mengganti semua data di perangkat ini dengan isi file. Lanjutkan?')){return}
      const n=migrate(p.data);
      n.tasksUpdatedAt=nowIso();
      n.sync={entries:{},tasksSynced:null,lastSync:null};

  };
  fr.onerror=function(){setMsg('err','File tidak bisa dibaca.');render()};
  fr.readAsText(file);

    S.tasks.push({id:uid(),order:uid(),type:s.type,text:text,points:s.points.trim(),date:date,created:today(),done:false});
  }else{
    const t=S.tasks.find(function(x){return x.id===s.id});

  }

function move(id,dir){
  const t=S.tasks.find(function(x){return x.id===id});if(!t)return;
  const sec=secOf(t);
  const list=S.tasks.filter(function(x){return !x.done&&secOf(x)===sec}).sort(byOrder);
  const i=list.findIndex(function(x){return x.id===id}),j=i+dir;
  if(j<0||j>=list.length)return;
  const tmp=list[i].order;list[i].order=list[j].order;list[j].order=tmp;
  touch();ui.menu=null;save();render();
}
function copyText(t){

  return new Promise(function(res,rej){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')?res():rej(new Error('Tidak bisa menyalin'))}catch(e){rej(e)}ta.remove();
  });
}

        const ed=$('#editor');
        if(ed){storeJournal(ui.jdate,ed.innerHTML);ui.dirty=false;toast('Jurnal disimpan')}
        break;
      }
      case 'code-show':ui.showCode=!ui.showCode;render();break;
      case 'code-rand':ui.codeDraft=randomCode();ui.showCode=true;try{localStorage.setItem(CODEKEY,ui.codeDraft)}catch(e){}ui.msg={k:'info',t:'Kode baru dibuat dan disimpan di perangkat ini. Salin dan simpan di tempat aman, karena dibutuhkan di perangkat lain.'};render();break;
      case 'code-copy':
        if(!ui.codeDraft){toast('Belum ada kode');break}
        copyText(ui.codeDraft).then(function(){toast('Kode disalin')},function(err){toast(err.message)});break;
      case 'sync-up':runSync(syncUp);break;
      case 'sync-down':runSync(syncDown);break;
      case 'export':doExport();break;
      case 'import':{const fi=$('#f-import');if(fi)fi.click();break}
    }
    return;
  }
  const cmd=e.target.closest('[data-cmd]');
  if(cmd){
    const ed=$('#editor');
    if(!ed)return;
    ed.focus();
    document.execCommand(cmd.dataset.cmd,false,null);
    ui.dirty=true;
  }
});

document.addEventListener('mousedown',function(e){
  if(e.target.closest('#toolbar button'))e.preventDefault();
});

document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='f-text'&&ui.sheet)ui.sheet.text=t.value;
  else if(t.id==='f-points'&&ui.sheet)ui.sheet.points=t.value;
  else if(t.id==='f-code')ui.codeDraft=t.value;
  else if(t.id==='editor'){ui.dirty=true;convertFonts()}
  else if(t.id==='tb-color'){
    restoreSel();
    document.execCommand('styleWithCSS',false,true);
    document.execCommand('foreColor',false,t.value);
    document.execCommand('styleWithCSS',false,false);
    const i=t.parentNode.querySelector('i');if(i)i.style.background=t.value;
    ui.dirty=true;
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='tb-size'){
    ui.sizePx=+e.target.value;
    restoreSel();
    document.execCommand('styleWithCSS',false,false);
    document.execCommand('fontSize',false,'7');
    convertFonts();
    ui.dirty=true;
  }else if(e.target.id==='f-import'){
    const f=e.target.files&&e.target.files[0];
    if(f)doImport(f);
    e.target.value='';
  }
});

window.addEventListener('pagehide',flushJournal);
document.addEventListener('visibilitychange',function(){
  if(document.hidden)flushJournal();
  else if(rollover()&&route()!=='journal')render();
});
setInterval(function(){if(rollover()&&route()!=='journal'&&!ui.busy)render()},30000);

/* ---------- Mulai ---------- */
rollover();
save();
render();
})();
</script>
</body>
</html>
