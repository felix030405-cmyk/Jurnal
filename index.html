    const start=s.pToday?today():s.pStart;
    if(s.mode==='add'){
      S.tasks.push({id:uid(),order:uid(),type:'periodik',text:text,points:s.points.trim(),date:null,created:today(),done:false,
        per:{start:start,n:n,mode:s.pMode,due:start,phase:start<=today()?'active':'wait',doneDate:null,cid:null}});
      touch();ui.sheet=null;save();render();toast('Task disimpan');return;
    }
    const t=S.tasks.find(function(x){return x.id===s.id});
    if(!t){ui.sheet=null;render();return}
    t.text=text;t.points=s.points.trim();
    const p=t.per;
    if(start===p.start&&s.pMode==='fix'&&(n!==p.n||p.mode!=='fix')){
      const b=parse(p.start);
      ui.pchoice={id:t.id,n:n,old:p.start,date:today(),pick:false,cal:{y:b.getFullYear(),m:b.getMonth()}};
      ui.sheet=null;touch();save();render();return;
    }
    ui.sheet=null;perApply(t,start,n,s.pMode);toast('Task disimpan');return;
  }
  const date=(s.type==='biasa'&&s.useDate)?s.date:null;
  if(s.mode==='add'){
    S.tasks.push({id:uid(),order:uid(),type:s.type,text:text,points:s.points.trim(),date:date,created:today(),done:false});
  }else{
    const t=S.tasks.find(function(x){return x.id===s.id});
    if(t){t.text=text;t.points=s.points.trim();t.date=date}
  }
  touch();ui.sheet=null;save();render();toast('Task disimpan');
}
function pchApply(start){
  const c=ui.pchoice,t=c&&S.tasks.find(function(x){return x.id===c.id});
  ui.pchoice=null;
  if(t&&t.type==='periodik')perApply(t,start,c.n,'fix');else render();
  toast('Task disimpan');
}
function move(id,dir){
  const t=S.tasks.find(function(x){return x.id===id});if(!t)return;
  const sec=manSec(t);
  const list=S.tasks.filter(function(x){return !x.done&&manSec(x)===sec}).sort(byOrder);
  const i=list.findIndex(function(x){return x.id===id}),j=i+dir;
  if(j<0||j>=list.length)return;
  const tmp=list[i].order;list[i].order=list[j].order;list[j].order=tmp;
  touch();ui.menu=null;save();render();
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  return new Promise(function(res,rej){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')?res():rej(new Error('Tidak bisa menyalin'))}catch(e){rej(e)}ta.remove();
  });
}

document.addEventListener('click',function(e){
  if(ui.menu!==null&&!e.target.closest('.more')){ui.menu=null;render()}
  const el=e.target.closest('[data-act]');
  if(el){
    const a=el.dataset.act,id=el.dataset.id?+el.dataset.id:null;
    switch(a){
      case 'toggle':toggleTask(id);break;
      case 'toggle-open':ui.open[el.dataset.k]=!ui.open[el.dataset.k];render();break;
      case 'menu':ui.menu=ui.menu===id?null:id;render();break;
      case 'add':openSheet('add',null);break;
      case 'edit':openSheet('edit',S.tasks.find(function(x){return x.id===id}));break;
      case 'up':move(id,-1);break;
      case 'down':move(id,1);break;
      case 'del':
        if(confirm('Hapus task ini? Riwayat selesai tetap tersimpan.')){
          S.tasks=S.tasks.filter(function(x){return x.id!==id});ui.menu=null;touch();save();render();
        }
        break;
      case 'close-sheet':ui.sheet=null;render();break;
      case 'stype':ui.sheet.type=el.dataset.v;render();break;
      case 'usedate':ui.sheet.useDate=!ui.sheet.useDate;render();break;
      case 'save-task':saveTask();break;
      case 'dback':ui.dback=!ui.dback;ui.pg.daily=0;render();break;
      case 'bpage':ui.pg[el.dataset.k]+=+el.dataset.dir;render();break;
      case 'toggle-y':toggleY(+el.dataset.i);break;
      case 'pmode':ui.sheet.pMode=el.dataset.v;render();break;
      case 'ptoday':ui.sheet.pToday=!ui.sheet.pToday;if(ui.sheet.pToday)ui.sheet.pStart=today();render();break;
      case 'pch-close':ui.pchoice=null;render();break;
      case 'pch-reset':pchApply(today());break;
      case 'pch-keep':pchApply(ui.pchoice.old);break;
      case 'pch-pick':ui.pchoice.pick=true;render();break;
      case 'pch-apply':pchApply(ui.pchoice.date);break;
      case 'cal-nav':{
        const c=calState(el.dataset.cal);c.m+=+el.dataset.dir;
        if(c.m<0){c.m=11;c.y--}
        if(c.m>11){c.m=0;c.y++}
        render();break;
      }
      case 'cal-pick':{
        const k=el.dataset.cal,d=el.dataset.date;
        if(k==='sheet'){if(ui.sheet.type==='periodik')ui.sheet.pStart=d;else ui.sheet.date=d}
        else if(k==='pch')ui.pchoice.date=d;
        else if(k==='fcal'){
          const pd=parse(d);ui.fm={y:pd.getFullYear(),m:pd.getMonth()};ui.fcal.open=false;
          const rows=finEnsure(curKey()),ef=finDates(rows,curKey()),ix=ef.findIndex(function(x,n){return x===d&&!finEmpty(rows[n])});
          ui.fscroll=ix>=0?rows[ix].id:null;
        }
        else if(k==='jcal'){ui.jdate=d;const pd=parse(d);ui.jt={y:pd.getFullYear(),m:pd.getMonth()};ui.jcal.open=false}
        else ui.cal.sel=d;
        render();break;
      }
      case 'open-journal':{const dd=parse(el.dataset.date);ui.jdate=el.dataset.date;ui.jt={y:dd.getFullYear(),m:dd.getMonth()};ui.jfrom='#calendar';ui.jcal.open=false;location.hash='#journal/edit';break}
      case 'j-open':{const dd=parse(el.dataset.date);ui.jdate=el.dataset.date;ui.jt={y:dd.getFullYear(),m:dd.getMonth()};ui.jfrom='#journal';ui.jcal.open=false;location.hash='#journal/edit';break}
      case 'jt-nav':{ui.jt.m+=+el.dataset.dir;if(ui.jt.m<0){ui.jt.m=11;ui.jt.y--}if(ui.jt.m>11){ui.jt.m=0;ui.jt.y++}render();window.scrollTo(0,0);break}
      case 'cshift':{const dd=parse(ui.cal.sel);dd.setDate(dd.getDate()+(+el.dataset.dir));ui.cal.sel=dkey(dd);ui.cal.y=dd.getFullYear();ui.cal.m=dd.getMonth();render();break}
      case 'goj':{const nn=new Date();ui.jdate=today();ui.jt={y:nn.getFullYear(),m:nn.getMonth()};ui.jfrom='#journal';ui.jcal.open=false;break}
      case 'jshift':{
        const d=parse(ui.jdate);d.setDate(d.getDate()+(+el.dataset.dir));
        ui.jdate=dkey(d);ui.jt={y:d.getFullYear(),m:d.getMonth()};ui.jcal.open=false;render();break;
      }
      case 'jcal':{
        const d=parse(ui.jdate);
        ui.jcal.open=!ui.jcal.open;ui.jcal.y=d.getFullYear();ui.jcal.m=d.getMonth();render();break;
      }
      case 'jsave':{
        const ed=$('#editor');
        if(ed&&route()==='notes/edit'){noteStore(ed.innerHTML);ui.dirty=false;toast('Catatan disimpan');location.hash='#notes'}
        else if(ed&&route()==='mandarin/note'){if(manNoteStore(ed.innerHTML)!==false){ui.dirty=false;toast('Catatan disimpan');location.hash=ui.mfrom||'#mandarin'}}
        else if(ed){storeJournal(ui.jdate,ed.innerHTML);ui.dirty=false;toast('Jurnal disimpan');location.hash=ui.jfrom||'#journal'}
        break;
      }
      case 'gp-open':ui.gpick={day:+el.dataset.day,row:+el.dataset.row};render();break;
      case 'gp-close':ui.gpick=null;render();break;
      case 'gp-clear':setRowRef(null);break;
      case 'gp-pick':setRowRef(id);break;
      case 'g-freeze':ui.freeze=!ui.freeze;try{localStorage.setItem('jurnal.freeze',ui.freeze?'1':'0')}catch(e){}render();break;
      case 'gs-top':ui.gsheet={t:'top'};render();break;
      case 'gs-day':ui.gsheet={t:'day',id:id};render();break;
      case 'gs-drow':ui.gsheet={t:'drow',id:+el.dataset.row,day:+el.dataset.day};render();break;
      case 'gs-group':ui.gsheet={t:'group',id:id};render();break;
      case 'gs-item':ui.gsheet={t:'item',id:id};render();break;
      case 'gs-close':ui.gsheet=null;render();break;
      case 'gs-do':gsDo(el.dataset.a);break;
      case 'g-addrow':gymAddRow(id);break;
      case 'g-addgroup':gymAddGroup();break;
      case 'fm-nav':{ui.bview=null;ui.fm.m+=+el.dataset.dir;if(ui.fm.m<0){ui.fm.m=11;ui.fm.y--}if(ui.fm.m>11){ui.fm.m=0;ui.fm.y++}ui.fcal.open=false;render();window.scrollTo(0,0);break}
      case 'fy-nav':ui.fm.y+=+el.dataset.dir;render();break;
      case 'fcal-toggle':ui.fcal.open=!ui.fcal.open;ui.fcal.y=ui.fm.y;ui.fcal.m=ui.fm.m;render();break;
      case 'fdate-open':ui.fdate=+el.dataset.row;render();break;
      case 'fdate-pick':{const r=finRow(ui.fdate);if(r){r.d=el.dataset.date;touchFin();save()}ui.fdate=null;render();break}
      case 'fdate-clear':{const r=finRow(ui.fdate);if(r){r.d='';touchFin();save()}ui.fdate=null;render();break}
      case 'fclose':ui.fdate=null;ui.fsheet=null;ui.fnew=null;render();break;
      case 'bud-mode':ui.bview=el.dataset.m;ui.bopen=null;render();break;
      case 'cad-add':{const C=cadEnsure();C.rows.push({id:S.fin.seq++,k:'',b:0});touchFin();save();render();break}
      case 'cad-del':{const C=cadEnsure();
        if(confirm('Hapus baris ini?')){C.rows=C.rows.filter(function(x){return x.id!==id});touchFin();save();render()}
        break}
      case 'liab-add':{const L=liabEnsure(curKey());L.push({id:S.fin.seq++,k:'',b:0});touchFin();save();render();break}
      case 'liab-del':{const key=curKey(),L=S.fin.liab&&S.fin.liab[key];
        if(L&&confirm('Hapus baris ini?')){S.fin.liab[key]=L.filter(function(x){return x.id!==id});touchFin();save();render()}
        break}
      case 'mut-open':ui.mut={t:el.dataset.t,id:+el.dataset.id};location.hash='#finance/mutasi';break;
      case 'pay-paid':{const mk=el.dataset.mk,P=S.fin.pay;
        if(P.paid[mk])delete P.paid[mk];else P.paid[mk]=today();
        touchFin();save();render();break}
      case 'pay-edit':ui.pedit=el.dataset.id;ui.fmt='paylater';location.hash='#finance/paylater';break;
      case 'pay-save':{
        const P=S.fin.pay,k=(document.getElementById('pay-k').value||'').trim().slice(0,80),
          nom=finInt(String(document.getElementById('pay-nom').value).replace(/\D/g,'')),
          n=Math.floor(+String(document.getElementById('pay-n').value).replace(/\D/g,'')),
          st=document.getElementById('pay-s').value;
        if(!k){toast('Isi keterangan dulu');break}
        if(!nom){toast('Isi nominal dulu');break}
        if(!(n>=1&&n<=120)){toast('Cicilan 1 sampai 120 kali');break}
        if(!/^\d{4}-\d\d$/.test(st))break;
        const ex=ui.pedit&&ui.pedit!=='new'?P.items.find(function(x){return x.id===+ui.pedit}):null;
        if(ex){ex.k=k;ex.nom=nom;ex.n=n;ex.start=st}
        else P.items.push({id:S.fin.seq++,k:k,nom:nom,start:st,n:n});
        ui.pedit=null;ui.fmt='paylater';touchFin();save();location.hash='#finance/manage';break}
      case 'pay-del':{const P=S.fin.pay;
        if(ui.pedit&&ui.pedit!=='new'&&confirm('Hapus paylater ini?')){P.items=P.items.filter(function(x){return x.id!==+ui.pedit});ui.pedit=null;ui.fmt='paylater';touchFin();save();location.hash='#finance/manage'}
        break}
      case 'bud-open':ui.bopen=ui.bopen===id?null:id;render();break;
      case 'frow-menu':ui.fsheet={t:'row',id:+el.dataset.row};render();break;
      case 'fh-menu':ui.fsheet={t:'hrow',id:+el.dataset.row};render();break;
      case 'fm-menu':ui.fsheet={t:el.dataset.t,id:+el.dataset.id};render();break;
      case 'fs-do':finSheetDo(el.dataset.a);break;
      case 'fadd':{
        const n=Math.max(1,Math.min(200,Math.floor(+ui.faddN)||1)),rows=finEnsure(curKey());
        const add=Math.min(n,600-rows.length);
        if(add<=0){toast('Maksimal 600 baris per bulan');break}
        for(let i=0;i<add;i++)rows.push(finBlank());
        touchFin();save();ui.fscroll=rows[rows.length-add].id;render();toast(add+' baris ditambahkan');break;
      }
      case 'fhadd':{
        const n=Math.max(1,Math.min(200,Math.floor(+ui.faddN)||1)),rows=S.fin.hut;
        const add=Math.min(n,600-rows.length);
        if(add<=0){toast('Maksimal 600 baris');break}
        for(let i=0;i<add;i++)rows.push(hutBlank());
        touchFin();save();render();toast(add+' baris ditambahkan');break;
      }
      case 'fpos-add':case 'fakn-add':case 'fnm-add':case 'finv-add':{
        const F=S.fin;let list,max,x;
        if(a==='fpos-add'){list=F.pos;max=30;x={id:F.seq++,name:'Posisi '+(list.length+1),t:''}}
        else if(a==='fakn-add'){list=F.akun;max=200;x={id:F.seq++,name:'Akun '+(list.filter(function(y){return y.c===el.dataset.c}).length+1),c:el.dataset.c}}
        else if(a==='fnm-add'){list=F.names;max=300;x={id:F.seq++,name:'Nama '+(list.length+1)}}
        else{list=F.inv;max=200;x={id:F.seq++,name:'Akun '+(list.length+1)}}
        if(list.length>=max){toast('Sudah mencapai batas');break}
        list.push(x);touchFin();save();ui.focusSel='.mname[data-id="'+x.id+'"]';render();break;
      }
      case 'note-new':ui.nedit={id:null};location.hash='#notes/edit';break;
      case 'note-open':ui.nedit={id:id};location.hash='#notes/edit';break;
      case 'note-menu':ui.nsheet={id:id};render();break;
      case 'nsheet-do':noteSheetDo(el.dataset.a);break;
      case 'nclose':ui.nsheet=null;render();break;
      case 'man-note':{ui.note={t:el.dataset.t,id:+el.dataset.id};ui.mfrom='#'+route();location.hash='#mandarin/note';break}
      case 'man-check':manToggle(id);break;
      case 'man-regen':manRegen();break;
      case 'man-sec-add':{
        const M=S.man;if(M.secs.length>=100){toast('Sudah mencapai batas');break}
        const sc={id:manUid(),title:'Section '+(M.secs.length+1),active:false,as:0,mode:'once',freq:3,n:'',lines:[]};
        M.secs.push(sc);touchMan();save();ui.focusSel='.mtitle[data-id="'+sc.id+'"]';render();break;
      }
      case 'man-line-add':{
        const sc=S.man.secs.find(function(x){return x.id===id});if(!sc)break;
        if(sc.lines.length>=500){toast('Maksimal 500 baris');break}
        const ln={id:manUid(),text:'',done:false,da:'',dd:'',n:''};
        sc.lines.push(ln);touchMan();save();ui.focusSel='input[data-mg="ltext"][data-id="'+ln.id+'"]';render();break;
      }
      case 'man-menu':ui.msheet={t:el.dataset.t,id:id};render();break;
      case 'msheet-do':manSheetDo(el.dataset.a);break;
      case 'mclose':ui.msheet=null;render();break;
      case 'fm-tab':ui.fmt=el.dataset.v;render();break;
      case 'ffull-open':ui.ffull=el.dataset.v;render();break;
      case 'ffull-close':ui.ffull=null;render();break;
      case 'fnew-save':finNewSave();break;
      case 'frep':ui.frep=el.dataset.v;render();break;
      case 'fyear':ui.fyear=!ui.fyear;render();break;
      case 'code-show':ui.showCode=!ui.showCode;render();break;
      case 'code-rand':ui.codeDraft=randomCode();ui.showCode=true;try{localStorage.setItem(CODEKEY,ui.codeDraft)}catch(e){}ui.msg={k:'info',t:'Kode baru dibuat dan disimpan di perangkat ini. Ingat kodenya, karena dibutuhkan di perangkat lain.'};render();break;
      case 'code-copy':
        if(!ui.codeDraft){toast('Belum ada kode');break}
        copyText(ui.codeDraft).then(function(){toast('Kode disalin')},function(err){toast(err.message)});break;
      case 'auto-toggle':{
        if(!S.sync.auto){
          try{readCode()}catch(err){setMsg('err',err.message);render();break}
          S.sync.auto=true;save();setMsg('ok','Sinkron otomatis aktif.');render();autoSync('toggle');
        }else{
          S.sync.auto=false;ui.as.state='idle';
          if(ui.as.timer){clearTimeout(ui.as.timer);ui.as.timer=null}
          save();setMsg('ok','Sinkron otomatis dimatikan.');render();
        }
        break;
      }
      case 'sync-up':runSync(syncUp);break;
      case 'sync-down':runSync(syncDown);break;
      case 'export':doExport();break;
      case 'import':{const fi=$('#f-import');if(fi)fi.click();break}
    }
    return;
  }
  const cmd=e.target.closest('[data-cmd]');
  if(cmd){
    const ed=$('#editor');
    if(!ed)return;
    ed.focus();
    document.execCommand(cmd.dataset.cmd,false,null);
    ui.dirty=true;
  }
});

function finAmt(t){
  const k=t.dataset&&t.dataset.fg;
  if(k==='bud'){return {r:(S.fin.bud&&S.fin.bud[curKey()])||{},f:t.dataset.id}}
  if(k==='bud1'){return {r:S.fin.bud1||{},f:curKey()}}
  if(k==='cb'){const r=cadEnsure().rows.find(function(x){return x.id===+t.dataset.id});return r?{r:r,f:'b'}:null}
  if(k==='ctarget'){return {r:cadEnsure(),f:'target'}}
  if(k==='lb'){const r=((S.fin.liab&&S.fin.liab[curKey()])||[]).find(function(x){return x.id===+t.dataset.id});return r?{r:r,f:'b'}:null}
  if(k==='i'||k==='o'){const r=finRow(+t.dataset.row);return r?{r:r,f:k}:null}
  if(k==='hi'||k==='ho'){const r=S.fin.hut.find(function(x){return x.id===+t.dataset.row});return r?{r:r,f:k==='hi'?'i':'o'}:null}
  return null;
}
document.addEventListener('focusin',function(e){
  const t=e.target,m=finAmt(t);
  if(m){t.value=m.r[m.f]||'';setTimeout(function(){try{t.select()}catch(x){}},0)}
});
document.addEventListener('focusout',function(e){
  const t=e.target,m=finAmt(t);
  if(m)t.value=m.r[m.f]?fmtRp(m.r[m.f]):'';
});
document.addEventListener('mousedown',function(e){
  if(e.target.closest('#toolbar button'))e.preventDefault();
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[role=button],.nrow')){e.preventDefault();e.target.click();return}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('.gt input:not([type=checkbox]),.gtitle,.mname,.mi')){e.preventDefault();e.target.blur()}
  if(e.key==='Enter'&&e.target.id==='f-newname'){e.preventDefault();finNewSave()}
  if(e.key==='Enter'&&e.target.id==='n-title'){e.preventDefault();const ed=$('#editor');if(ed)ed.focus()}
});

document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='f-text'&&ui.sheet)ui.sheet.text=t.value;
  else if(t.id==='f-points'&&ui.sheet)ui.sheet.points=t.value;
  else if(t.id==='f-pn'&&ui.sheet)ui.sheet.pN=t.value;
  else if(t.id==='f-code')ui.codeDraft=t.value;
  else if(t.id==='f-gsearch')filterPick(t.value);
  else if(t.id==='f-fadd')ui.faddN=t.value;
  else if(t.id==='n-title')ui.dirty=true;
  else if(t.id==='editor'){ui.dirty=true;convertFonts()}
  else if(t.id==='tb-color'){
    restoreSel();
    document.execCommand('styleWithCSS',false,true);
    document.execCommand('foreColor',false,t.value);
    document.execCommand('styleWithCSS',false,false);
    const i=t.parentNode.querySelector('i');if(i)i.style.background=t.value;
    ui.dirty=true;
  }
});
document.addEventListener('change',function(e){
  if(manChange(e.target))return;
  if(finChange(e.target))return;
  if(gymChange(e.target))return;
  if(e.target.id==='tb-size'){
    ui.sizePx=+e.target.value;
    restoreSel();
    document.execCommand('styleWithCSS',false,false);
    document.execCommand('fontSize',false,'7');
    convertFonts();
    ui.dirty=true;
  }else if(e.target.id==='f-import'){
    const f=e.target.files&&e.target.files[0];
    if(f)doImport(f);
    e.target.value='';
  }
});

window.addEventListener('pagehide',flushJournal);
document.addEventListener('visibilitychange',function(){
  if(document.hidden){flushJournal();if(S.sync.auto&&pendingUpload()&&!localEmpty()){if(ui.as.timer){clearTimeout(ui.as.timer);ui.as.timer=null}autoSync('hide')}}
  else{
    if(rollover()&&route()!=='journal/edit'&&route()!=='mandarin/note'&&route()!=='notes/edit')render();
    autoSync('visible');
  }
});
window.addEventListener('online',function(){autoSync('online')});
setInterval(function(){if(rollover()&&route()!=='journal/edit'&&route()!=='mandarin/note'&&route()!=='notes/edit'&&!ui.busy)render()},30000);

/* ---------- Mulai ---------- */
rollover();
save();
render();
setTimeout(function(){autoSync('start')},1500);
})();
