<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe5ff">
<title>Self Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-a:#eaf8ff;--sky-b:#bfe6ff;--sky-c:#86c9f4;--grp:#eaf4ff;
  --card:rgba(255,255,255,.82);--card-solid:#ffffff;--glass:rgba(240,249,255,.78);
  --ink:#0a2744;--mut:#58768f;--line:rgba(24,92,160,.13);--line2:rgba(24,92,160,.28);
  --acc:#1779d4;--acc2:rgba(23,121,212,.12);--on-acc:#ffffff;--red:#ec4a5a;--ok:#0f9d7a;
  --sh:0 6px 22px -10px rgba(10,80,150,.35);
  --wave:rgba(255,255,255,.45);--blob1:rgba(255,255,255,.85);--blob2:rgba(80,190,255,.45);--blob3:rgba(0,200,200,.28);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --sky-a:#06203d;--sky-b:#07305a;--sky-c:#06445f;--grp:#123a62;
    --card:rgba(12,40,70,.78);--card-solid:#0e2a48;--glass:rgba(7,32,60,.82);
    --ink:#e6f2ff;--mut:#8db1d6;--line:rgba(130,190,255,.16);--line2:rgba(130,190,255,.32);
    --acc:#5cb8ff;--acc2:rgba(92,184,255,.16);--on-acc:#04213f;--red:#ff7480;--ok:#38d3a9;
    --sh:0 6px 22px -10px rgba(0,0,0,.6);
    --wave:rgba(90,180,255,.13);--blob1:rgba(60,140,255,.28);--blob2:rgba(0,170,220,.25);--blob3:rgba(40,100,200,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  color:var(--ink);font:16px/1.5 var(--body);
  background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 48%,var(--sky-c) 100%) fixed;
  min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 120px}

/* Latar laut */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(55px)}
.bg i:nth-child(1){width:300px;height:300px;left:-90px;top:-60px;background:var(--blob1)}
.bg i:nth-child(2){width:340px;height:340px;right:-140px;top:36%;background:var(--blob2)}
.bg i:nth-child(3){width:280px;height:280px;left:-70px;bottom:6%;background:var(--blob3)}
.waves{position:absolute;left:0;bottom:0;width:200%;height:150px;opacity:1;animation:drift 38s linear infinite}
.waves.w2{height:110px;animation-duration:26s;animation-direction:reverse}
.waves path{fill:var(--wave)}
@keyframes drift{to{transform:translateX(-50%)}}

/* Beranda */
.hero{padding:calc(30px + env(safe-area-inset-top)) 2px 22px;position:relative}
.greet{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);padding:6px 14px 6px 8px;border-radius:30px;font-weight:600;font-size:14px;color:var(--mut);backdrop-filter:blur(8px)}
.greet svg{width:22px;height:22px}
.hero h1{margin:14px 0 4px;font:800 clamp(44px,13vw,58px)/.95 var(--display);letter-spacing:-.035em;color:var(--ink)}
.hero p{margin:0;color:var(--mut);font-weight:500}
.sun,.moon{position:absolute;right:-6px;top:calc(22px + env(safe-area-inset-top));width:104px;height:104px}
.moon{display:none}
@media (prefers-color-scheme:dark){.sun{display:none}.moon{display:block}}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;overflow:hidden;color:#fff;padding:16px 16px 15px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 18px 30px -16px rgba(8,70,140,.65),inset 0 1px 0 rgba(255,255,255,.4)}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 0% 0%,rgba(255,255,255,.34),transparent 55%);pointer-events:none}
.tile .badge{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.35)}
.tile svg.ic{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .ghost{position:absolute;right:-30px;top:-14px;width:120px;height:120px;stroke:#fff;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;opacity:.14}
.tile b{display:block;font:700 22px/1.1 var(--display);letter-spacing:-.01em}
.tile span.st{display:block;font-size:13px;font-weight:500;opacity:.92;margin-top:3px;line-height:1.3}
.tbar{height:5px;background:rgba(255,255,255,.28);border-radius:5px;margin-top:9px;overflow:hidden}
.tbar i{display:block;height:100%;background:#fff;border-radius:5px}
.t1{background:linear-gradient(150deg,#1f8fe8,#37c0f4);border-radius:30px 30px 30px 10px}
.t2{background:linear-gradient(150deg,#0a9ab3,#2fd0c4);border-radius:30px 10px 30px 30px}
.t3{background:linear-gradient(150deg,#2b4fb8,#5d86e6);border-radius:10px 30px 30px 30px}
.t4{background:linear-gradient(150deg,#d99a16,#f6cf68);border-radius:30px 30px 10px 30px}
.t5{background:linear-gradient(150deg,#e8553b,#ff9a6b);border-radius:30px 10px 30px 30px}
.t6{background:linear-gradient(150deg,#47698c,#8fb4d6);border-radius:10px 30px 30px 30px}
.tile.soon{background:transparent;color:var(--mut);box-shadow:none;border:2px dashed var(--line2);align-items:center;justify-content:center;text-align:center;min-height:168px;border-radius:26px}
.tile.soon::after{display:none}
.tile.soon b{font-size:15px;font-weight:600;font-family:var(--body)}
.tile.soon .plus{font-size:30px;line-height:1;font-weight:300;margin-bottom:4px}
/* satu urutan muncul saat beranda dibuka */
.grid.enter .tile{animation:surf .7s cubic-bezier(.2,.8,.2,1) both}
.grid.enter .tile:nth-child(2){animation-delay:.08s}
.grid.enter .tile:nth-child(3){animation-delay:.16s}
.grid.enter .tile:nth-child(4){animation-delay:.24s}
.grid.enter .tile:nth-child(5){animation-delay:.32s}
.grid.enter .tile:nth-child(6){animation-delay:.4s}
@keyframes surf{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}

/* Bilah atas & tab */
.topbar{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;z-index:5;margin:0 -16px 6px;padding-left:16px;padding-right:16px;background:linear-gradient(180deg,var(--glass) 70%,transparent)}
.topbar h1{margin:0;font:700 21px/1 var(--display);text-align:center;letter-spacing:-.01em}
.back{font-size:30px;line-height:1;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--card);box-shadow:var(--sh)}
.tabs{display:flex;background:var(--card);border-radius:16px;padding:4px;box-shadow:var(--sh);margin-bottom:14px}
.tabs a{flex:1;text-align:center;padding:10px 0;border-radius:12px;font-weight:600;font-size:15px;color:var(--mut)}
.tabs a.on{background:var(--acc);color:var(--on-acc)}
.pagetitle{font:700 19px/1.2 var(--display);margin:4px 2px 12px}

/* Kartu & tabel */
.card{background:var(--card);backdrop-filter:blur(10px);border-radius:20px;padding:14px 14px 8px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--line)}
.sec-h{display:flex;align-items:center;justify-content:space-between;min-height:28px;margin-bottom:4px}
.sec-h h2{margin:0;font:700 17px/1.2 var(--display)}
.pct{font:700 16px var(--display);color:var(--acc)}
.bar{height:7px;border-radius:7px;background:var(--acc2);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#33c4e0);border-radius:7px;transition:width .35s}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;color:var(--mut);text-align:left;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:11px 4px;border-bottom:1px solid var(--line);vertical-align:middle;word-break:break-word}
tr:last-child td{border-bottom:0}
.n{width:28px;color:var(--mut)}.p{width:54px;color:var(--mut)}.c{width:40px;text-align:center}.tm{width:64px;color:var(--mut)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);vertical-align:middle}
tr.done td{opacity:.45;transition:opacity .2s}
tr.done td:not(.c){text-decoration:line-through}
.cal-ic{display:inline-flex;vertical-align:middle;color:var(--red);margin-left:4px}
.cal-ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dtxt{display:block;font-size:12px;color:var(--mut)}
.empty-msg{text-align:center;color:var(--mut);padding:40px 12px}

/* Manage */
.linkrow{display:flex;justify-content:flex-end;margin-bottom:10px}
.btn-soft{background:var(--acc2);color:var(--acc);font-weight:700;padding:9px 15px;border-radius:13px;font-size:14px}
.stitle{font:700 15px var(--display);color:var(--mut);margin:18px 4px 8px}
.tcard{background:var(--card);backdrop-filter:blur(10px);border-radius:18px;padding:12px 8px 12px 14px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--line);display:flex;align-items:center;gap:10px;position:relative}
.tcard .no{color:var(--mut);font-size:14px;width:20px}
.tinfo{flex:1;min-width:0}
.tt{word-break:break-word;font-weight:500}
.tmeta{font-size:12.5px;color:var(--mut);margin-top:2px}
.more{position:relative}
.more>button{width:38px;height:38px;font-size:22px;border-radius:50%;color:var(--mut)}
.dd{position:absolute;right:0;top:40px;background:var(--card-solid);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 30px rgba(0,30,70,.28);z-index:10;min-width:150px;overflow:hidden}
.dd button{display:block;width:100%;text-align:left;padding:12px 16px;font-size:15px}
.dd button.off{opacity:.35;pointer-events:none}
.dd button.del{color:var(--red)}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:linear-gradient(145deg,#2a9bf0,#1769c8);color:#fff;font-size:34px;line-height:1;box-shadow:0 12px 24px -6px rgba(10,90,190,.6);z-index:20;display:flex;align-items:center;justify-content:center}
.overlay{position:fixed;inset:0;background:rgba(2,20,45,.5);z-index:30}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card-solid);border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;z-index:31}
.sheet h3{margin:0 0 14px;font:700 20px var(--display)}
.seg{display:flex;background:var(--acc2);border-radius:13px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.seg.lock{opacity:.7;pointer-events:none}
label.f{display:block;font-size:13.5px;font-weight:600;color:var(--mut);margin-bottom:12px}
label.f input{display:block;width:100%;margin-top:5px;padding:12px;border-radius:13px;border:1px solid var(--line2);background:var(--card-solid);color:var(--ink);font:500 16px var(--body)}
label.chk{display:flex;align-items:center;gap:10px;margin:4px 0 12px;font-size:15px}
.btn{display:block;width:100%;background:var(--acc);color:var(--on-acc);font-weight:700;padding:14px;border-radius:15px;margin-top:10px;text-align:center}
.btn.alt{background:var(--acc2);color:var(--acc)}
.btn[disabled]{opacity:.5;pointer-events:none}
.seldate{font-size:14px;color:var(--acc);font-weight:700;margin:6px 2px 10px}

/* Kalender mini */
.cal{background:transparent;border-radius:16px;padding:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h b{font:700 17px var(--display)}
.cal-h button{width:38px;height:38px;font-size:24px;border-radius:12px;background:var(--acc2);color:var(--acc)}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-w span{text-align:center;font-size:12px;color:var(--mut);padding:4px 0;font-weight:600}
.cell{position:relative;height:44px;margin:2px;border-radius:13px;font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center}
.cell.empty{pointer-events:none}
.cell.today{border:1.5px solid var(--acc);color:var(--acc);font-weight:700}
.cell.sel{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.sheet .cal{background:var(--acc2)}
.calbox{background:var(--card);backdrop-filter:blur(10px);border-radius:22px;padding:6px;box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:14px}
.calbox .cal{padding:6px}

/* Detail kalender */
.drow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.drow span{flex:1;font-weight:500}
.drow button{width:34px;height:34px;font-size:20px;color:var(--mut);border-radius:50%}
.dl{list-style:none;margin:0;padding:6px 0 6px 6px;font-size:14px}
.dl li{padding:4px 0;display:flex;gap:8px}
.dl li.ok span{color:var(--ok)}.dl li.no span{color:var(--red)}
.dl li.no{color:var(--mut)}
.sub{font:700 13px var(--display);color:var(--mut);margin:12px 0 2px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .st{width:20px;text-align:center;color:var(--mut)}
.item.done{opacity:.5}.item.done .tx{text-decoration:line-through}
.item .tx{flex:1;word-break:break-word}
.item small{color:var(--mut)}
.diary{padding-bottom:14px;word-break:break-word}
.diary ul,.diary ol{margin:4px 0;padding-left:22px}
.none{color:var(--mut);font-size:14px;padding:6px 0 10px}

/* Jurnal */
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.datebar .nav{width:46px;height:46px;font-size:26px;background:var(--card);border-radius:15px;box-shadow:var(--sh);border:1px solid var(--line)}
.datebar .datebtn{flex:1;height:46px;background:var(--card);border-radius:15px;box-shadow:var(--sh);border:1px solid var(--line);font-weight:700;font-size:15px}
.datebtn small{color:var(--acc);font-weight:700}
.pop{margin-bottom:12px}
.paper{
  background-color:#fffefb;color:#23303d;
  background-image:
    linear-gradient(to right,transparent 44px,#f0b4b4 44px,#f0b4b4 45px,transparent 45px),
    repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#c9ddf2 31px,#c9ddf2 32px);
  background-attachment:local,local;
  border-radius:14px;box-shadow:var(--sh);
  min-height:calc(100vh - 330px);padding:0 14px 40px 58px;
  font-size:17px;line-height:32px;outline:none;word-break:break-word
}
.paper:empty:before{content:attr(data-ph);color:#9fb0c4;pointer-events:none}
.paper div,.paper p{margin:0}
.paper ul,.paper ol{margin:0;padding-left:26px}
.paper li{line-height:32px}
.jsave{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:21;background:linear-gradient(145deg,#2a9bf0,#1769c8);color:#fff;font-weight:700;padding:13px 24px;border-radius:30px;box-shadow:0 12px 24px -6px rgba(10,90,190,.6)}
.toolbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--card-solid);border-top:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));overflow-x:auto;z-index:20}
.toolbar button,.toolbar label,.toolbar select{flex:0 0 auto;min-width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--acc2);border:0;color:var(--ink)}
.toolbar select{padding:0 8px;font:600 14px var(--body)}
.toolbar .tb-c{position:relative;font-weight:700;overflow:hidden}
.toolbar .tb-c input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.toolbar .tb-c i{position:absolute;left:10px;right:10px;bottom:6px;height:3px;border-radius:2px;background:#d93025}

/* Pengaturan */
.set p{margin:0 0 12px;color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;margin-bottom:10px}
.row .btn,.row .btn-soft{margin-top:0;flex:1;padding:11px 8px;font-size:14px}
.stat{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-of-type{border-bottom:0}
.stat span:first-child{color:var(--mut)}
.msg{margin:12px 0 4px;padding:11px 13px;border-radius:14px;font-size:14px;word-break:break-word;white-space:pre-line}
.msg.ok{background:rgba(15,157,122,.14);color:var(--ok)}
.msg.err{background:rgba(236,74,90,.14);color:var(--red)}
.msg.info{background:var(--acc2);color:var(--acc)}
.hint{font-size:12.5px;color:var(--mut);margin:-4px 2px 12px}

/* Gym */
.topbar .back.gear{font-size:22px}
.gnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--card-solid);border-top:1px solid var(--line);display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:8px;z-index:20}
.gnav a{flex:1;text-align:center;padding:11px 0;border-radius:13px;font-weight:700;color:var(--mut)}
.gnav a.on{background:var(--acc);color:var(--on-acc)}
.gfreeze{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px 10px;font-weight:600;font-size:13px;color:var(--mut)}
input[type=checkbox].gsw{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:22px;background:var(--line2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
input[type=checkbox].gsw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=checkbox].gsw:checked{background:var(--acc)}
input[type=checkbox].gsw:checked::after{left:18px}
.gcard{margin:0 -16px 10px;padding:0 0 4px;background:var(--card-solid);border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;backdrop-filter:none;overflow:hidden}
.gday-h{display:flex;align-items:center;gap:4px;padding:6px 6px 2px 14px}
.gtitle{flex:1;min-width:0;border:0;background:transparent;font:700 15px var(--display);color:var(--ink);padding:6px 4px;border-radius:6px}
.gtitle:focus{background:var(--acc2);outline:2px solid var(--acc)}
.gwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-padding-right:36px}
.gwrap.frz{scroll-padding-left:164px}
.gt{table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12.5px}
.gt th,.gt td{padding:0 4px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;text-align:left}
.gt th{font-size:11.5px;font-weight:600;color:var(--mut);height:28px;background:var(--card-solid)}
.gt td{height:36px;background:var(--card-solid)}
.gt tr:last-child td{border-bottom:0}
.gt .c-kode,.gt .c-no{text-align:center}
.gt.frz .c-exercise{position:sticky;left:0;z-index:2;box-shadow:3px 0 4px -3px rgba(0,40,90,.25)}
.gt .c-menu{position:sticky;right:0;z-index:2;text-align:center}
.gt .c-sep{background:var(--acc2);padding:0}
.gt .c-done,.gt .c-upd{text-align:center}
.gt input:not([type=checkbox]){width:100%;min-width:0;border:0;background:transparent;color:inherit;font:inherit;padding:7px 3px;border-radius:6px}
.gt input:not([type=checkbox]):focus{background:var(--acc2);outline:2px solid var(--acc)}
.gt input:disabled{opacity:.35}
.gt input[type=checkbox]{width:18px;height:18px}
.gt .gkode{display:block;text-align:center;font-weight:700;color:var(--acc)}
.gt .gcode{display:block;width:100%;height:100%;font:inherit;font-weight:700;color:var(--acc);padding:8px 0}

<script>
(function(){
'use strict';

/* ---------- Util ---------- */
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HARI3=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const today=()=>dkey(new Date());
const isDateKey=k=>typeof k==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(k)&&dkey(parse(k))===k;
const longDate=k=>{const d=parse(k);return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear()};
const shortDate=k=>{const d=parse(k);return d.getDate()+' '+BULAN[d.getMonth()].slice(0,3)+' '+d.getFullYear()};
const stamp=iso=>{const d=new Date(iso);return isNaN(d)?'-':d.getDate()+' '+BULAN[d.getMonth()].slice(0,3)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const nowIso=()=>new Date().toISOString();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const app=document.getElementById('app');
const clean=o=>JSON.parse(JSON.stringify(o));

const ICON_CAL='<span class="cal-ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span>';

/* ---------- Sanitizer (data cloud tidak dipercaya) ---------- */
const OKTAG={B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,DIV:1,P:1,BR:1,SPAN:1};
const DROPTAG={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,NOSCRIPT:1,TEMPLATE:1,SVG:1,MATH:1,LINK:1,META:1,FORM:1,TEXTAREA:1,SELECT:1,BUTTON:1,INPUT:1,TITLE:1,HEAD:1};
function safeColor(c){
  if(!c)return '';
  return (/^#[0-9a-f]{3,8}$/i.test(c)||/^rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}(\s*,\s*[\d.]+)?\s*\)$/i.test(c))?c:'';
}
function safeSize(s){
  const m=/^(\d{1,2})px$/.exec(s||'');
  return m&&+m[1]>=8&&+m[1]<=60?s:'';
}
function cleanNode(src,dst,depth){
  if(depth>40)return;
  src.childNodes.forEach(n=>{
    if(n.nodeType===3){dst.appendChild(document.createTextNode(n.nodeValue));return}
    if(n.nodeType!==1)return;
    const tag=n.tagName.toUpperCase();
    if(DROPTAG[tag])return;
    if(OKTAG[tag]){
      const el=document.createElement(tag.toLowerCase());
      if(tag==='SPAN'){
        const c=safeColor(n.style&&n.style.color),f=safeSize(n.style&&n.style.fontSize);
        if(c)el.style.color=c;
        if(f)el.style.fontSize=f;
      }
      if(tag!=='BR')cleanNode(n,el,depth+1);
      dst.appendChild(el);
    }else cleanNode(n,dst,depth+1);
  });
}
function sanitize(html){
  const doc=new DOMParser().parseFromString('<body>'+String(html==null?'':html).slice(0,900000),'text/html');
  const out=document.createElement('div');
  cleanNode(doc.body,out,0);
  return out.innerHTML;
}
function htmlTitle(html){
  const tmp=document.createElement('div');tmp.innerHTML=sanitize(html);
  for(const n of tmp.childNodes){
    const t=(n.textContent||'').trim();
    if(t)return t.slice(0,80);
  }
  return '';
}
function htmlEmpty(html){
  const tmp=document.createElement('div');tmp.innerHTML=sanitize(html);
  return !tmp.textContent.trim();
}

/* ---------- Data ---------- */
const KEY='selfjournal.v1';
const CODEKEY='jurnal.syncCode';
const GROUP_DEFAULTS=['Triceps','Biceps','Chest','Shoulder','Back','Forearm','Trapz','Core','Leg'];
function gymDefault(){
  let n=1;
  const groups=GROUP_DEFAULTS.map(function(nm){return {id:n++,name:nm,items:[]}});
  const days=[{id:n++,title:'Day 1',rows:[]}];
  return {seq:n,groups:groups,days:days,hist:[]};
}
function gymSeed(){
  const G=[
    ['Triceps',[
      ['Cable Overhead Extension','Long Head','Isolation','Jungle 8 - Adjustable Pulley','2','8','9'],
      ['Single-Arm Cable Head','Lateral / Medial head','Isolation','Jungle 8 - Single Handle','2','8','6']]],
    ['Biceps',[
      ['Incline Dumbell Curl','Long Head','Isolation','Bench + Dumbell','2','8','7'],
      ['Preacher Curl','Short Head','Isolation','Preacher Bench','2','8','7'],
      ['Hammer Curl','Brachialis','Isolation','Dumbell','2','8','10']]],
    ['Chest',[
      ['Bench Press','Middle Chest','Compound','Bench + Power Rack / Smith Machine','2','8','5'],
      ['Cable fly','Upper chest','Isolation','Jungle 8 - Adjustable Pulley','2','8','2,5'],
      ['Pec Deck Fly','Pectoralis Major','Isolation','Pec Fly','2','8','25']]],
    ['Shoulder',[
      ['Machine Shoulder Press','Anterior Deltoid','Compound','Multi Press Machine','2','8','6'],
      ['Lateral Raise','Lateral Deltoid','Isolation','Jungle 8 - Adjustable Pulley','2','8','6'],
      ['Reverse Pec Deck','Rear Deltoid','Isolation','Pec Fly','2','8','12']]],
    ['Back',[
      ['Lat Pulldown','Lats','Compound','Jungle 8 - Pulldown','2','8','30'],
      ['Seated Cable Row','Rhomboids + Middle Trap','Compound','Jungle 8 - Row','2','8','18'],
      ['Lat Pulldown','Lats','Compound','Jungle 8 - Pulldown','2','8','37,5']]],
    ['Forearm',[
      ['Wrist Curl','Flexor','Isolation','Dumbell','2','8','12'],
      ['Reverse Wrist Curl','Extensor','Isolation','Dumbell','2','8','8,5']]],
    ['Trapz',[
      ['Dumbell Shrug','Upper Trap','Isolation','Dumbell','2','20','15']]],
    ['Core',[
      ['Plank','Anti-extension','Isolation','Exercise mat','2','60',''],
      ['Russian Twist','Obliques','Isolation','Dumbell','2','24','10']]],
    ['Leg',[
      ['Leg Press','Quadriceps + glutes','Compound','Leg Press Machine','2','8','7,5'],
      ['Leg Extension','Quadriceps','Isolation','Leg extension machine','2','8','16'],
      ['Leg Curl','Hamstring','Isolation','Leg Curl Prone Machine','2','8','16'],
      ['Standing Calf Raise','Calf','Compound','Smith Machine','2','8','22,5'],
      ['Hip abduction','Hip abductors','Isolation','Abductor / adductor machine','2','8','16'],
      ['Hip addiction','Hip adductors','Isolation','Abductor / adductor machine','2','8','16']]]
  ];
  const D=[
    ['Day 1',['3-1','3-2','1-1','1-2']],
    ['Day 2',['5-1','5-2','2-1','2-2']],
    ['Day 3',['4-1','4-2','4-3','8-1','8-2']],
    ['Day 4',['9-1','9-2','9-3','9-4','9-5','9-6','6-1','6-2']],
    ['Day 5',['3-3','5-3','4-2','7-1','2-3']]
  ];
  let n=1;
  const groups=G.map(function(g){return {id:n++,name:g[0],items:[]}});
  G.forEach(function(g,gi){
    g[1].forEach(function(x){
      groups[gi].items.push({id:n++,exercise:x[0],target:x[1],type:x[2],machine:x[3],set:x[4],rep:x[5],weight:x[6],next:''});
    });
  });
  const days=D.map(function(d){
    return {id:n++,title:d[0],rows:d[1].map(function(c){
      const p=c.split('-');
      return {id:n++,ref:groups[+p[0]-1].items[+p[1]-1].id,draft:'',done:false};
    })};
  });
  return {seq:n,groups:groups,days:days,hist:[]};
}
function gymPristine(g){
  return g.groups.every(function(x){return !x.items.length})&&g.days.every(function(d){return !d.rows.length});
}
function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v)}
function normGym(raw){
  if(!isObj(raw)||!Array.isArray(raw.groups))return gymDefault();
  const used=new Set();let mx=Number(raw.seq)||1;
  const nid=function(v){
    let n=Number(v);
    if(!Number.isFinite(n)||n<1||used.has(n)){n=++mx}
    used.add(n);if(n>mx)mx=n;return n;
  };
  const itemIds=new Set();
  const groups=raw.groups.filter(isObj).slice(0,200).map(function(g){
    return {id:nid(g.id),name:str(g.name,40),items:(Array.isArray(g.items)?g.items:[]).filter(isObj).slice(0,500).map(function(i){
      const id=nid(i.id);itemIds.add(id);
      return {id:id,exercise:str(i.exercise,80),target:str(i.target,60),type:str(i.type,40),machine:str(i.machine,40),
        set:str(i.set,20),rep:str(i.rep,20),weight:str(i.weight,20),next:str(i.next,20)};
    })};
  });
  const days=(Array.isArray(raw.days)?raw.days:[]).filter(isObj).slice(0,100).map(function(d){
    return {id:nid(d.id),title:str(d.title,40)||'Day',rows:(Array.isArray(d.rows)?d.rows:[]).filter(isObj).slice(0,500).map(function(r){
      const ref=Number(r.ref);
      return {id:nid(r.id),ref:itemIds.has(ref)?ref:null,draft:str(r.draft,10),done:!!r.done};
    })};
  });
  const hist=(Array.isArray(raw.hist)?raw.hist:[]).filter(isObj).slice(-1500).map(function(h){
    return {item:Number(h.item)||0,ex:str(h.ex,60),at:str(h.at,30),from:str(h.from,20),to:str(h.to,20)};
  });
  return {seq:mx+1,groups:groups,days:days,hist:hist};
}
function blank(){
  return {tasks:[],checks:{},locked:{},completed:[],journals:{},lastDate:today(),seq:1,tasksUpdatedAt:null,
    gym:gymSeed(),gymUpdatedAt:nowIso(),
    sync:{entries:{},tasksSynced:null,gymSynced:null,lastSync:null}};
}
function migrate(raw){
  const S0=blank();
  if(!raw||typeof raw!=='object')return S0;
  S0.tasks=normTasks(raw.tasks);
  S0.checks=normChecks(raw.checks);
  S0.locked=normLocked(raw.locked);
  S0.completed=normCompleted(raw.completed);
  S0.lastDate=isDateKey(raw.lastDate)?raw.lastDate:today();
  const jn={};
  if(raw.journals&&typeof raw.journals==='object'){
    Object.keys(raw.journals).forEach(d=>{
      if(!isDateKey(d))return;
      const j=raw.journals[d];
      if(typeof j==='string'){
        if(!htmlEmpty(j))jn[d]={html:sanitize(j),createdAt:nowIso(),updatedAt:nowIso()};
      }else if(j&&typeof j==='object'){
        const ca=typeof j.createdAt==='string'?j.createdAt:nowIso();
        const ua=typeof j.updatedAt==='string'?j.updatedAt:ca;
        jn[d]=j.deleted?{html:'',deleted:true,createdAt:ca,updatedAt:ua}
          :{html:sanitize(typeof j.html==='string'?j.html:''),createdAt:ca,updatedAt:ua};
      }
    });
  }
  S0.journals=jn;
  let mx=Number(raw.seq)||1;
  S0.tasks.forEach(t=>{mx=Math.max(mx,t.id+1,t.order+1)});
  S0.completed.forEach(c=>{mx=Math.max(mx,c.id+1)});
  S0.seq=mx;
  S0.tasksUpdatedAt=typeof raw.tasksUpdatedAt==='string'?raw.tasksUpdatedAt:null;
  if(!S0.tasksUpdatedAt&&(S0.tasks.length||S0.completed.length||Object.keys(S0.locked).length))S0.tasksUpdatedAt=nowIso();
  const sy=raw.sync&&typeof raw.sync==='object'?raw.sync:{};
  const rg=raw.gym,hasG=isObj(rg)&&Array.isArray(rg.groups);
  S0.gym=hasG?normGym(rg):gymSeed();
  S0.gymUpdatedAt=typeof raw.gymUpdatedAt==='string'?raw.gymUpdatedAt:null;
  if(!hasG||(gymPristine(S0.gym)&&!S0.gymUpdatedAt)){S0.gym=gymSeed();S0.gymUpdatedAt=nowIso()}
  S0.sync={entries:(sy.entries&&typeof sy.entries==='object')?sy.entries:{},tasksSynced:typeof sy.tasksSynced==='string'?sy.tasksSynced:null,gymSynced:typeof sy.gymSynced==='string'?sy.gymSynced:null,lastSync:typeof sy.lastSync==='string'?sy.lastSync:null};
  return S0;
}
function str(v,max){return typeof v==='string'?v.slice(0,max):(typeof v==='number'?String(v).slice(0,max):'')}
function normTasks(a){
  if(!Array.isArray(a))return [];
  return a.filter(t=>t&&typeof t==='object'&&Number.isFinite(Number(t.id))).map(t=>{
    const o={id:Number(t.id),order:Number.isFinite(Number(t.order))?Number(t.order):Number(t.id),
      type:t.type==='daily'?'daily':'biasa',text:str(t.text,200),points:str(t.points==null?'':String(t.points),20),
      date:isDateKey(t.date)?t.date:null,created:isDateKey(t.created)?t.created:today(),done:!!t.done};
    if(o.done&&isDateKey(t.doneDate))o.doneDate=t.doneDate;
    return o;
  });
}
function normChecks(o){
  const r={};
  if(o&&typeof o==='object')Object.keys(o).forEach(k=>{
    if(isDateKey(k)&&Array.isArray(o[k]))r[k]=o[k].map(Number).filter(Number.isFinite);
  });
  return r;
}
function normLocked(o){
  const r={};
  if(o&&typeof o==='object')Object.keys(o).forEach(k=>{
    if(isDateKey(k)&&Array.isArray(o[k]))r[k]=o[k].filter(i=>i&&typeof i==='object').map(i=>({text:str(i.text,200),points:str(i.points==null?'':String(i.points),20),done:!!i.done}));
  });
  return r;
}
function normCompleted(a){
  if(!Array.isArray(a))return [];
  return a.filter(c=>c&&typeof c==='object'&&isDateKey(c.date)&&Number.isFinite(Number(c.id))).map(c=>({
    id:Number(c.id),taskId:Number(c.taskId)||0,text:str(c.text,200),points:str(c.points==null?'':String(c.points),20),
    date:c.date,time:/^\d{2}:\d{2}$/.test(c.time)?c.time:'00:00',attach:isDateKey(c.attach)?c.attach:null
  }));
}
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&typeof r==='object')return migrate(r)}catch(e){}
  return blank();
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Gagal menyimpan data di browser')}}
const touch=()=>{S.tasksUpdatedAt=nowIso()};
const uid=()=>S.seq++;
const byOrder=(a,b)=>a.order-b.order;
const dailyTasks=()=>S.tasks.filter(t=>t.type==='daily').sort(byOrder);
const getJ=d=>{const j=S.journals[d];return j&&!j.deleted&&j.html?j:null};

function secOf(t){
  if(t.type==='daily')return 'daily';
  if(t.date&&t.date>today())return 'dated';
  return 'biasa';
}
function isDone(t){
  if(t.type==='daily')return (S.checks[today()]||[]).indexOf(t.id)>=0;
  return !!t.done;
}

/* Kunci daily setiap ganti hari + bersihkan task selesai hari lalu */
function rollover(){
  const td=today();let changed=false;
  if(S.lastDate<td){
    const d=parse(S.lastDate),end=parse(td);let guard=0;
    while(d<end&&guard++<4000){
      const k=dkey(d);
      const ch=S.checks[k]||[];
      const items=dailyTasks().filter(t=>t.created<=k).map(t=>({text:t.text,points:t.points,done:ch.indexOf(t.id)>=0}));
      if(items.length)S.locked[k]=items;
      delete S.checks[k];
      d.setDate(d.getDate()+1);
    }
    S.lastDate=td;changed=true;
  }
  const n=S.tasks.length;
  S.tasks=S.tasks.filter(t=>!(t.done&&t.doneDate&&t.doneDate<td));
  if(S.tasks.length!==n)changed=true;
  if(changed){touch();save()}
  return changed;
}

function toggleTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const td=today();
  if(t.type==='daily'){
    const a=S.checks[td]||(S.checks[td]=[]);
    const i=a.indexOf(id);
    if(i>=0)a.splice(i,1);else a.push(id);
  }else if(t.done){
    t.done=false;delete t.doneDate;
    S.completed=S.completed.filter(c=>c.taskId!==id);
  }else{
    const n=new Date();
    t.done=true;t.doneDate=td;
    S.completed.push({id:uid(),taskId:id,text:t.text,points:t.points,date:td,time:pad(n.getHours())+':'+pad(n.getMinutes()),attach:t.date||null});
  }
  touch();save();render();
}

/* ---------- UI state ---------- */
const now0=new Date();
const ui={
  menu:null,sheet:null,open:{},
  cal:{y:now0.getFullYear(),m:now0.getMonth(),sel:today()},
  jcal:{open:false,y:now0.getFullYear(),m:now0.getMonth()},
  jdate:today(),editDate:null,dirty:false,range:null,sizePx:17,lastRoute:null,
  codeDraft:(function(){try{return localStorage.getItem(CODEKEY)||''}catch(e){return ''}})(),
  showCode:false,busy:false,msg:null,homeAnimated:false,gsheet:null,gpick:null,jt:{y:now0.getFullYear(),m:now0.getMonth()},jfrom:'#journal',focusSel:null,freeze:(function(){try{return localStorage.getItem('jurnal.freeze')==='1'}catch(e){return false}})()
};

/* ---------- Toast ---------- */
let toastT;
function toast(msg){
  const el=$('#toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800);
}

/* ---------- Komponen ---------- */
function topbar(title,back,right){
  return '<div class="topbar"><a class="back" href="'+back+'" aria-label="Kembali">‹</a><h1>'+title+'</h1>'+(right||'<span></span>')+'</div>';

function calHTML(key,c,sel,dots){
  const first=new Date(c.y,c.m,1),off=(first.getDay()+6)%7,days=new Date(c.y,c.m+1,0).getDate(),td=today();
  let cells='';
  for(let i=0;i<off;i++)cells+='<span class="cell empty"></span>';
  for(let d=1;d<=days;d++){

function pctOf(items){
  if(!items.length)return 0;
  return Math.round(items.filter(i=>i.done).length/items.length*100);
}
function dailyInfo(d){
  const td=today();
  if(d===td){
    const ch=S.checks[td]||[];
    const it=dailyTasks().map(t=>({text:t.text,points:t.points,done:ch.indexOf(t.id)>=0}));
    return it.length?it:null;
  }
  const l=S.locked[d];
  return l&&l.length?l:null;
}

  const nd=S.tasks.filter(t=>t.date&&!t.done).length;

}

const COLN={no:'No',kode:'Kode',muscle:'Muscle',target:'Target',exercise:'Exercise',type:'Type',machine:'Machine',set:'Set',rep:'Rep',weight:'Weight',done:'Done',sep:'',next:'Next weight',upd:'Update',menu:''};
const BASE_W=['no','kode','muscle','target','exercise','type','machine','set','rep','weight','sep','next','menu'];

function findItem(id){
  const gs=S.gym.groups;
  for(let gi=0;gi<gs.length;gi++){
    const i=gs[gi].items.findIndex(function(x){return x.id===id});
    if(i>=0)return {g:gs[gi],gi:gi,i:i,it:gs[gi].items[i]};
  }
  return null;
}
const itemCode=f=>(f.gi+1)+'-'+(f.i+1);
function codeToItem(txt){
  const m=/^\s*(\d{1,3})\s*[-.,]\s*(\d{1,3})\s*$/.exec(txt||'');
  if(!m)return null;
  const g=S.gym.groups[+m[1]-1];if(!g)return null;
  const it=g.items[+m[2]-1];
  return it?it.id:null;
}
function usedIn(ids){
  const names=[];
  S.gym.days.forEach(function(d){if(d.rows.some(function(r){return ids.indexOf(r.ref)>=0}))names.push(d.title)});
  return names;
}
function dropRefs(ids){
  S.gym.days.forEach(function(d){d.rows=d.rows.filter(function(r){return ids.indexOf(r.ref)<0})});
}
function setWeight(it,val){
  val=String(val).trim().slice(0,20);
  if(val===it.weight)return;
  const h=S.gym.hist;
  h.push({item:it.id,ex:it.exercise,at:nowIso(),from:it.weight,to:val});
  if(h.length>1500)h.splice(0,h.length-1500);
  it.weight=val;
}

function gsDo(a){
  const s=ui.gsheet;if(!s)return;
  const G0=S.gym;
  const mv=function(arr,i,d){
    const j=i+d;if(i<0||j<0||j>=arr.length)return;
    const t=arr[i];arr[i]=arr[j];arr[j]=t;
  };
  let focus=null,cancel=false;
  if(s.t==='top'){
    if(a==='addday'){
      const d={id:gUid(),title:'Day '+(G0.days.length+1),rows:[]};
      G0.days.push(d);focus='.gtitle[data-id="'+d.id+'"]';
    }else if(a==='reset'){
      G0.days.forEach(function(d){d.rows.forEach(function(r){r.done=false})});
      toast('Semua Done dikosongkan');
    }
  }else if(s.t==='day'){
    const i=G0.days.findIndex(function(x){return x.id===s.id});
    if(a==='up')mv(G0.days,i,-1);
    else if(a==='down')mv(G0.days,i,1);
    else if(a==='delday'&&i>=0){
      if(confirm('Hapus tabel "'+G0.days[i].title+'"? Semua barisnya ikut terhapus.'))G0.days.splice(i,1);
      else cancel=true;
    }
  }else if(s.t==='drow'){
    const d=G0.days.find(function(x){return x.id===s.day});
    const i=d?d.rows.findIndex(function(x){return x.id===s.id}):-1;
    if(i>=0){
      if(a==='up')mv(d.rows,i,-1);
      else if(a==='down')mv(d.rows,i,1);
      else if(a==='delrow')d.rows.splice(i,1);
    }
  }else if(s.t==='group'){
    const gi=G0.groups.findIndex(function(x){return x.id===s.id});
    if(gi>=0){
      const g=G0.groups[gi];
      if(a==='additem'){
        const it={id:gUid(),exercise:'',target:'',type:'',machine:'',set:'',rep:'',weight:'',next:''};
        g.items.push(it);focus='tr[data-item="'+it.id+'"] input[data-f="exercise"]';
      }else if(a==='up')mv(G0.groups,gi,-1);
      else if(a==='down')mv(G0.groups,gi,1);
      else if(a==='delgroup'){
        const ids=g.items.map(function(x){return x.id});
        const used=usedIn(ids);
        let msg='Hapus header "'+g.name+'"'+(ids.length?' beserta '+ids.length+' latihan di dalamnya':'')+'?';
        if(used.length)msg+='\nLatihan dipakai di: '+used.join(', ')+'. Barisnya ikut dihapus dari Daily.';
        if(confirm(msg)){dropRefs(ids);G0.groups.splice(gi,1)}
        else cancel=true;
      }
    }
  }else if(s.t==='item'){
    const f=findItem(s.id);
    if(f){
      if(a==='up')mv(f.g.items,f.i,-1);
      else if(a==='down')mv(f.g.items,f.i,1);
      else if(a==='delitem'){
        const used=usedIn([f.it.id]);
        let msg='Hapus baris '+itemCode(f)+(f.it.exercise?' ('+f.it.exercise+')':'')+'?';
        if(used.length)msg+='\nDipakai di: '+used.join(', ')+'. Barisnya ikut dihapus dari Daily.';
        if(confirm(msg)){dropRefs([f.it.id]);f.g.items.splice(f.i,1)}
        else cancel=true;
      }
    }
  }
  if(!cancel){touchGym();save()}
  ui.gsheet=null;ui.focusSel=focus;render();
}

/* Edit di tempat tanpa render ulang supaya fokus tidak hilang */
function fillRow(tr,f){
  const it=f?f.it:null;
  const map={exercise:it?it.exercise:'',muscle:f?f.g.name:'',target:it?it.target:'',type:it?it.type:'',machine:it?it.machine:'',set:it?it.set:'',rep:it?it.rep:''};
  tr.querySelectorAll('[data-d]').forEach(function(el){el.textContent=map[el.dataset.d]||''});
  tr.querySelectorAll('[data-g="f"]').forEach(function(el){
    el.dataset.id=it?it.id:'';el.disabled=!it;el.value=it?it[el.dataset.f]:'';
  });
}
function syncInputs(id,fld){
  const f=findItem(id);if(!f)return;
  document.querySelectorAll('[data-g="f"][data-id="'+id+'"][data-f="'+fld+'"]').forEach(function(el){el.value=f.it[fld]});
}
function gymChange(t){
  const k=t.dataset&&t.dataset.g;if(!k)return false;
  const G0=S.gym;
  if(k==='gname'){
    const g=G0.groups.find(function(x){return x.id===+t.dataset.id});
    if(g){
      g.name=t.value.trim().slice(0,40);t.value=g.name;
      document.querySelectorAll('tr[data-grp="'+g.id+'"] .gmuscle').forEach(function(el){el.textContent=g.name});
      touchGym();save();
    }
  }else if(k==='dtitle'){
    const d=G0.days.find(function(x){return x.id===+t.dataset.id});
    if(d){d.title=t.value.trim().slice(0,40)||d.title;t.value=d.title;touchGym();save()}
  }else if(k==='f'){
    const f=findItem(+t.dataset.id);if(!f)return true;
    const fld=t.dataset.f;
    const v=t.value.trim().slice(0,FMAX[fld]||20);
    if(fld==='weight')setWeight(f.it,v);else f.it[fld]=v;
    t.value=f.it[fld];
    syncInputs(f.it.id,fld);touchGym();save();
  }else if(k==='code'){
    const tr=t.closest('tr');
    const d=G0.days.find(function(x){return x.id===+tr.dataset.day});
    const r=d&&d.rows.find(function(x){return x.id===+t.dataset.row});
    if(!r)return true;
    const id=codeToItem(t.value);
    r.ref=id;r.draft=id?'':t.value.trim().slice(0,10);
    const ff=id?findItem(id):null;
    fillRow(tr,ff);
    t.value=ff?itemCode(ff):r.draft;
    t.classList.toggle('bad',!ff&&!!r.draft);
    touchGym();save();
  }else if(k==='done'){
    const tr=t.closest('tr');
    const d=G0.days.find(function(x){return x.id===+tr.dataset.day});
    const r=d&&d.rows.find(function(x){return x.id===+t.dataset.row});
    if(r){r.done=t.checked;tr.classList.toggle('gdone',r.done);touchGym();save()}
  }else if(k==='upd'){
    const tr=t.closest('tr');
    const d=G0.days.find(function(x){return x.id===+tr.dataset.day});
    const r=d&&d.rows.find(function(x){return x.id===+t.dataset.row});
    t.checked=false;
    const f=r&&r.ref?findItem(r.ref):null;
    if(!f){toast('Isi kode latihan dulu');return true}
    if(!f.it.next){toast('Isi Next weight dulu');return true}
    setWeight(f.it,f.it.next);f.it.next='';
    syncInputs(f.it.id,'weight');syncInputs(f.it.id,'next');
    touchGym();save();toast('Weight diperbarui: '+f.it.weight);
  }
  return true;
}

function cloudEntries(snap){
  const map={};
  snap.forEach(function(d){
    const id=d.id;if(!isDateKey(id))return;
    const v=d.data();if(!v||typeof v!=='object')return;
    map[id]=v;
  });
  return map;
}
const BLOCKS=[
  {k:'tasks',label:'task',sk:'tasksSynced',ck:'tasksUpdatedAt',dk:'data',
    at:function(){return S.tasksUpdatedAt},
    build:function(){return {tasksUpdatedAt:S.tasksUpdatedAt,data:{tasks:S.tasks,checks:S.checks,locked:S.locked,completed:S.completed,seq:S.seq,lastDate:S.lastDate}}},
    hasLocal:function(){return !!(S.tasks.length||S.completed.length||Object.keys(S.locked).length)},
    apply:function(d,at){
      S.tasks=normTasks(d.tasks);S.checks=normChecks(d.checks);S.locked=normLocked(d.locked);S.completed=normCompleted(d.completed);
      let mx=Number(d.seq)||1;
      S.tasks.forEach(function(t){mx=Math.max(mx,t.id+1,t.order+1)});
      S.completed.forEach(function(c){mx=Math.max(mx,c.id+1)});
      S.seq=Math.max(S.seq,mx);
      S.lastDate=(isDateKey(d.lastDate)&&d.lastDate<=today())?d.lastDate:today();
      S.tasksUpdatedAt=at;
    }},
  {k:'gym',label:'data Gym',sk:'gymSynced',ck:'gymUpdatedAt',dk:'gym',
    at:function(){return S.gymUpdatedAt},
    build:function(){return {gymUpdatedAt:S.gymUpdatedAt,gym:S.gym}},
    hasLocal:function(){return S.gym.groups.some(function(g){return g.items.length})||S.gym.days.some(function(d){return d.rows.length})},
    apply:function(d,at){S.gym=normGym(d);S.gymUpdatedAt=at}}
];
function cloudBlock(rootData){
  const p=rootData&&isObj(rootData.pengaturan)?rootData.pengaturan:null;
  return p&&p.app==='journal'?p:null;
}
async function pushBlock(F,db,code,B,cp){
  const at=B.at();
  if(!at||at===S.sync[B.sk])return null;
  const cAt=cp&&typeof cp[B.ck]==='string'?cp[B.ck]:null;
  if(cAt===at){S.sync[B.sk]=at;return null}
  if(cAt&&cAt!==S.sync[B.sk]){
    if(!confirm('Data '+B.label+' di cloud berbeda dari catatan terakhir perangkat ini (cloud diubah '+stamp(cAt)+').\n\nTimpa dengan versi perangkat ini?'))return 'skip';
  }
  const blk=clean(B.build());
  if(JSON.stringify(blk).length>900000)throw new Error('Data '+B.label+' terlalu besar untuk satu dokumen (batas 1 MiB).');
  const pg=Object.assign({app:'journal',v:1},blk);
  await F.setDoc(F.doc(db,'jurnalApp',code),{pengaturan:pg,updatedAt:nowIso()},
    {mergeFields:['pengaturan.app','pengaturan.v','pengaturan.'+B.ck,'pengaturan.'+B.dk,'updatedAt']});
  S.sync[B.sk]=at;save();
  return 'sent';
}
function pullBlock(B,cp){
  const cAt=cp&&typeof cp[B.ck]==='string'?cp[B.ck]:null;
  const cd=cp?cp[B.dk]:null;
  if(!cAt||!isObj(cd)||cAt===S.sync[B.sk])return null;
  if(cAt===B.at()){S.sync[B.sk]=cAt;return null}
  const localChanged=B.at()&&B.at()!==S.sync[B.sk];
  if(B.hasLocal()&&localChanged){
    if(!confirm('Data '+B.label+' di perangkat ini juga berubah sejak sinkron terakhir (cloud diubah '+stamp(cAt)+').\n\nGanti dengan data '+B.label+' dari cloud?'))return 'skip';
  }
  B.apply(cd,cAt);S.sync[B.sk]=cAt;
  return 'got';
}
async function syncUp(){
  const code=readCode();
  const x=await fb(),db=x.db,F=x.F;
  const res=await Promise.all([F.getDocs(F.collection(db,'jurnalApp',code,'entries')),F.getDoc(F.doc(db,'jurnalApp',code))]);
  const cloud=cloudEntries(res[0]);
  const rootData=res[1].exists()?res[1].data():null;
  const dates=Object.keys(S.journals).sort();
  const todo=[],conflicts=[];
  dates.forEach(function(d){
    const j=S.journals[d],synced=S.sync.entries[d],c=cloud[d];
    if(j.updatedAt===synced)return;
    if(c&&c.updatedAt===j.updatedAt){S.sync.entries[d]=j.updatedAt;return}
    if(j.deleted&&!c&&!synced){S.sync.entries[d]=j.updatedAt;return}
    if(c&&c.updatedAt!==synced)conflicts.push(d);
    todo.push(d);
  });
  let skip=[];
  if(conflicts.length&&!confirm('Entri di cloud berbeda dari catatan terakhir perangkat ini untuk:\n'+conflicts.map(shortDate).join(', ')+'\n\nTimpa dengan versi perangkat ini?'))skip=conflicts;
  let sent=0;
  for(const d of todo){
    if(skip.indexOf(d)>=0)continue;
    const j=S.journals[d],c=cloud[d]||{};
    const data=clean({
      title:j.deleted?'':htmlTitle(j.html),
      text:j.deleted?'':sanitize(j.html),
      mood:typeof c.mood==='string'?c.mood:'',
      tags:Array.isArray(c.tags)?c.tags.filter(function(t){return typeof t==='string'}):[],
      createdAt:j.createdAt,updatedAt:j.updatedAt,deleted:!!j.deleted
    });
    if(JSON.stringify(data).length>900000)throw new Error('Jurnal '+shortDate(d)+' terlalu besar untuk satu dokumen (batas 1 MiB).');
    await F.setDoc(F.doc(db,'jurnalApp',code,'entries',d),data);
    S.sync.entries[d]=j.updatedAt;save();sent++;
  }
  const cp=cloudBlock(rootData),sentB=[],skipB=[];
  for(const B of BLOCKS){
    const r=await pushBlock(F,db,code,B,cp);
    if(r==='sent')sentB.push(B.label);else if(r==='skip')skipB.push(B.label);
  }
  S.sync.lastSync=nowIso();save();
  const parts=[sent+' jurnal'].concat(sentB);
  const skipped=skip.length||skipB.length?' Dilewati: '+(skip.length?skip.length+' jurnal':'')+(skip.length&&skipB.length?', ':'')+skipB.join(', ')+'.':'';
  return 'Upload selesai: '+parts.join(', ')+' terkirim.'+skipped;
}
async function syncDown(){
  const code=readCode();
  const x=await fb(),db=x.db,F=x.F;
  const res=await Promise.all([F.getDocs(F.collection(db,'jurnalApp',code,'entries')),F.getDoc(F.doc(db,'jurnalApp',code))]);
  const cloud=cloudEntries(res[0]);
  const rootData=res[1].exists()?res[1].data():null;
  const apply=[],conflicts=[];
  Object.keys(cloud).sort().forEach(function(d){
    const c=cloud[d];
    if(typeof c.updatedAt!=='string')return;
    const synced=S.sync.entries[d],l=S.journals[d];
    if(c.updatedAt===synced)return;
    if(l&&l.updatedAt===c.updatedAt){S.sync.entries[d]=c.updatedAt;return}
    const localChanged=l&&l.updatedAt!==synced;
    if(localChanged)conflicts.push(d);
    apply.push(d);
  });
  let skip=[];
  if(conflicts.length&&!confirm('Jurnal berikut berubah di perangkat ini dan di cloud:\n'+conflicts.map(shortDate).join(', ')+'\n\nPakai versi cloud?'))skip=conflicts;
  let got=0;
  apply.forEach(function(d){
    if(skip.indexOf(d)>=0)return;
    const c=cloud[d];
    const ca=typeof c.createdAt==='string'?c.createdAt:c.updatedAt;
    if(c.deleted===true||typeof c.text!=='string'||htmlEmpty(c.text)){
      S.journals[d]={html:'',deleted:true,createdAt:ca,updatedAt:c.updatedAt};
    }else{
      S.journals[d]={html:sanitize(c.text),createdAt:ca,updatedAt:c.updatedAt};
    }
    S.sync.entries[d]=c.updatedAt;got++;
  });
  const cp=cloudBlock(rootData),gotB=[],skipB=[];
  let tasksGot=false;
  BLOCKS.forEach(function(B){
    const r=pullBlock(B,cp);
    if(r==='got'){gotB.push(B.label);if(B.k==='tasks')tasksGot=true}
    else if(r==='skip')skipB.push(B.label);
  });
  S.sync.lastSync=nowIso();save();
  if(tasksGot)rollover();
  const parts=[got+' jurnal'].concat(gotB);
  const skipped=skip.length||skipB.length?' Dilewati: '+(skip.length?skip.length+' jurnal':'')+(skip.length&&skipB.length?', ':'')+skipB.join(', ')+'.':'';
  return 'Ambil selesai: '+parts.join(', ')+' diperbarui.'+skipped;
}
async function runSync(fn){
  if(ui.busy)return;
  flushJournal();
  ui.busy=true;ui.msg=null;render();
  try{setMsg('ok',await fn())}
  catch(err){setMsg('err',(err&&err.message)?err.message:String(err))}
  ui.busy=false;render();
}
function doExport(){
  const out=clean(S);delete out.sync;
  const payload={app:'journal',version:1,exportedAt:nowIso(),data:out};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='Jurnal-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
  setMsg('ok','File backup diunduh.');render();
}
function doImport(file){
  const fr=new FileReader();
  fr.onload=function(){
    try{
      const p=JSON.parse(fr.result);
      if(!p||p.app!=='journal'||!p.data)throw new Error('Bukan file backup Jurnal.');
      if(!confirm('Import akan mengganti semua data di perangkat ini dengan isi file. Lanjutkan?')){return}
      const n=migrate(p.data);
      n.tasksUpdatedAt=nowIso();n.gymUpdatedAt=nowIso();
      n.sync={entries:{},tasksSynced:null,gymSynced:null,lastSync:null};
      S=n;save();rollover();
      setMsg('ok','Import selesai: '+Object.keys(S.journals).length+' jurnal dan '+S.tasks.length+' task dimuat.');
    }catch(err){setMsg('err','Import gagal: '+err.message)}
    render();
  };
  fr.onerror=function(){setMsg('err','File tidak bisa dibaca.');render()};
  fr.readAsText(file);
}

/* ---------- Helper jurnal ---------- */
function storeJournal(d,html){
  const now=nowIso(),ex=S.journals[d];
  if(htmlEmpty(html)){
    if(ex&&!ex.deleted)S.journals[d]={html:'',deleted:true,createdAt:ex.createdAt,updatedAt:now};
  }else{
    if(ex&&!ex.deleted&&ex.html===html)return;
    S.journals[d]={html:html,createdAt:(ex&&ex.createdAt)||now,updatedAt:now};
  }
  save();
}
function flushJournal(){
  const ed=$('#editor');
  if(ed&&ui.dirty&&ui.editDate){storeJournal(ui.editDate,ed.innerHTML);ui.dirty=false}
}
function initEditor(){
  const ed=$('#editor');if(!ed)return;
  const j=getJ(ui.jdate);
  ed.innerHTML=j?sanitize(j.html):'';
  ui.editDate=ui.jdate;ui.dirty=false;
  try{document.execCommand('defaultParagraphSeparator',false,'div')}catch(e){}
}
function restoreSel(){
  const ed=$('#editor');if(!ed)return;
  ed.focus();
  if(ui.range){const s=getSelection();s.removeAllRanges();s.addRange(ui.range)}
}
function convertFonts(){
  const ed=$('#editor');if(!ed)return;
  ed.querySelectorAll('font[size="7"]').forEach(function(f){
    const sp=document.createElement('span');
    sp.style.fontSize=ui.sizePx+'px';
    while(f.firstChild)sp.appendChild(f.firstChild);
    f.replaceWith(sp);
  });
}
document.addEventListener('selectionchange',function(){
  const ed=$('#editor'),s=getSelection();
  if(ed&&s.rangeCount&&ed.contains(s.anchorNode))ui.range=s.getRangeAt(0).cloneRange();
});

/* ---------- Router / render ---------- */
const route=()=>location.hash.replace('#','')||'home';
function render(){
  flushJournal();
  const r=route(),sy=window.scrollY;
  const gsc={};
  document.querySelectorAll('.gwrap').forEach(function(el){gsc[el.dataset.key]=el.scrollLeft});
  let html;
  if(r==='task')html=viewDisplay();
  else if(r==='task/manage')html=viewManage();
  else if(r==='task/done')html=viewDone();
  else if(r==='calendar')html=viewCalendar();
  else if(r==='journal')html=viewJournalTable();
  else if(r==='journal/edit')html=viewJournal();
  else if(r==='settings')html=viewSettings();
  else if(r==='gym')html=viewGymDaily();
  else if(r==='gym/workout')html=viewGymWorkout();
  else if(r==='finance')html=viewFinance();
  else html=viewHome();
  app.innerHTML=html;
  if(r==='journal/edit')initEditor();
  window.scrollTo(0,ui.lastRoute===r?sy:0);
  if(ui.lastRoute===r)document.querySelectorAll('.gwrap').forEach(function(el){if(gsc[el.dataset.key])el.scrollLeft=gsc[el.dataset.key]});
  if(r==='journal'&&ui.lastRoute!==r){const tr=document.querySelector('.jt tr.today');if(tr){try{tr.scrollIntoView({block:'center'})}catch(e){}}}
  ui.lastRoute=r;
  if(ui.focusSel){
    const fe=document.querySelector(ui.focusSel);ui.focusSel=null;
    if(fe){fe.focus();try{fe.scrollIntoView({block:'center',inline:'nearest'})}catch(e){}}
  }
}
window.addEventListener('hashchange',function(){ui.menu=null;ui.sheet=null;ui.gsheet=null;ui.gpick=null;ui.jcal.open=false;render()});

/* ---------- Event ---------- */
function calState(k){return k==='sheet'?ui.sheet.cal:k==='jcal'?ui.jcal:ui.cal}
function openSheet(mode,t){
  const base=t?parse(t.date||today()):new Date();
  ui.sheet={
    mode:mode,id:t?t.id:null,type:t?t.type:'daily',
    text:t?t.text:'',points:t?(t.points||''):'',
    useDate:!!(t&&t.date),date:(t&&t.date)||today(),
    cal:{y:base.getFullYear(),m:base.getMonth()}
  };
  ui.menu=null;render();
}
function saveTask(){
  const s=ui.sheet,text=s.text.trim();
  if(!text){toast('Isi keterangan task dulu');return}
  const date=(s.type==='biasa'&&s.useDate)?s.date:null;
  if(s.mode==='add'){
    S.tasks.push({id:uid(),order:uid(),type:s.type,text:text,points:s.points.trim(),date:date,created:today(),done:false});
  }else{
    const t=S.tasks.find(function(x){return x.id===s.id});
    if(t){t.text=text;t.points=s.points.trim();t.date=date}
  }
  touch();ui.sheet=null;save();render();toast('Task disimpan');
}
function move(id,dir){
  const t=S.tasks.find(function(x){return x.id===id});if(!t)return;
  const sec=secOf(t);
  const list=S.tasks.filter(function(x){return !x.done&&secOf(x)===sec}).sort(byOrder);
  const i=list.findIndex(function(x){return x.id===id}),j=i+dir;
  if(j<0||j>=list.length)return;
  const tmp=list[i].order;list[i].order=list[j].order;list[j].order=tmp;
  touch();ui.menu=null;save();render();
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  return new Promise(function(res,rej){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')?res():rej(new Error('Tidak bisa menyalin'))}catch(e){rej(e)}ta.remove();
  });
}

document.addEventListener('click',function(e){
  if(ui.menu!==null&&!e.target.closest('.more')){ui.menu=null;render()}
  const el=e.target.closest('[data-act]');
  if(el){
    const a=el.dataset.act,id=el.dataset.id?+el.dataset.id:null;
    switch(a){
      case 'toggle':toggleTask(id);break;
      case 'toggle-open':ui.open[el.dataset.k]=!ui.open[el.dataset.k];render();break;
      case 'menu':ui.menu=ui.menu===id?null:id;render();break;
      case 'add':openSheet('add',null);break;
      case 'edit':openSheet('edit',S.tasks.find(function(x){return x.id===id}));break;
      case 'up':move(id,-1);break;
      case 'down':move(id,1);break;
      case 'del':
        if(confirm('Hapus task ini? Riwayat selesai tetap tersimpan.')){
          S.tasks=S.tasks.filter(function(x){return x.id!==id});ui.menu=null;touch();save();render();
        }
        break;
      case 'close-sheet':ui.sheet=null;render();break;
      case 'stype':ui.sheet.type=el.dataset.v;render();break;
      case 'usedate':ui.sheet.useDate=!ui.sheet.useDate;render();break;
      case 'save-task':saveTask();break;
      case 'cal-nav':{
        const c=calState(el.dataset.cal);c.m+=+el.dataset.dir;
        if(c.m<0){c.m=11;c.y--}
        if(c.m>11){c.m=0;c.y++}
        render();break;
      }
      case 'cal-pick':{
        const k=el.dataset.cal,d=el.dataset.date;
        if(k==='sheet')ui.sheet.date=d;
        else if(k==='jcal'){ui.jdate=d;const pd=parse(d);ui.jt={y:pd.getFullYear(),m:pd.getMonth()};ui.jcal.open=false}
        else ui.cal.sel=d;
        render();break;
      }
      case 'open-journal':{const dd=parse(el.dataset.date);ui.jdate=el.dataset.date;ui.jt={y:dd.getFullYear(),m:dd.getMonth()};ui.jfrom='#calendar';ui.jcal.open=false;location.hash='#journal/edit';break}
      case 'j-open':{const dd=parse(el.dataset.date);ui.jdate=el.dataset.date;ui.jt={y:dd.getFullYear(),m:dd.getMonth()};ui.jfrom='#journal';ui.jcal.open=false;location.hash='#journal/edit';break}
      case 'jt-nav':{ui.jt.m+=+el.dataset.dir;if(ui.jt.m<0){ui.jt.m=11;ui.jt.y--}if(ui.jt.m>11){ui.jt.m=0;ui.jt.y++}render();window.scrollTo(0,0);break}
      case 'cshift':{const dd=parse(ui.cal.sel);dd.setDate(dd.getDate()+(+el.dataset.dir));ui.cal.sel=dkey(dd);ui.cal.y=dd.getFullYear();ui.cal.m=dd.getMonth();render();break}
      case 'goj':{const nn=new Date();ui.jdate=today();ui.jt={y:nn.getFullYear(),m:nn.getMonth()};ui.jfrom='#journal';ui.jcal.open=false;break}
      case 'jshift':{
        const d=parse(ui.jdate);d.setDate(d.getDate()+(+el.dataset.dir));
        ui.jdate=dkey(d);ui.jt={y:d.getFullYear(),m:d.getMonth()};ui.jcal.open=false;render();break;
      }
      case 'jcal':{
        const d=parse(ui.jdate);
        ui.jcal.open=!ui.jcal.open;ui.jcal.y=d.getFullYear();ui.jcal.m=d.getMonth();render();break;
      }
      case 'jsave':{
        const ed=$('#editor');
        if(ed){storeJournal(ui.jdate,ed.innerHTML);ui.dirty=false;toast('Jurnal disimpan')}
        break;
      }
      case 'gp-open':ui.gpick={day:+el.dataset.day,row:+el.dataset.row};render();break;
      case 'gp-close':ui.gpick=null;render();break;
      case 'gp-clear':setRowRef(null);break;
      case 'gp-pick':setRowRef(id);break;
      case 'g-freeze':ui.freeze=!ui.freeze;try{localStorage.setItem('jurnal.freeze',ui.freeze?'1':'0')}catch(e){}render();break;
      case 'gs-top':ui.gsheet={t:'top'};render();break;
      case 'gs-day':ui.gsheet={t:'day',id:id};render();break;
      case 'gs-drow':ui.gsheet={t:'drow',id:+el.dataset.row,day:+el.dataset.day};render();break;
      case 'gs-group':ui.gsheet={t:'group',id:id};render();break;
      case 'gs-item':ui.gsheet={t:'item',id:id};render();break;
      case 'gs-close':ui.gsheet=null;render();break;
      case 'gs-do':gsDo(el.dataset.a);break;
      case 'g-addrow':gymAddRow(id);break;
      case 'g-addgroup':gymAddGroup();break;
      case 'code-show':ui.showCode=!ui.showCode;render();break;
      case 'code-rand':ui.codeDraft=randomCode();ui.showCode=true;try{localStorage.setItem(CODEKEY,ui.codeDraft)}catch(e){}ui.msg={k:'info',t:'Kode baru dibuat dan disimpan di perangkat ini. Ingat kodenya, karena dibutuhkan di perangkat lain.'};render();break;
      case 'code-copy':
        if(!ui.codeDraft){toast('Belum ada kode');break}
        copyText(ui.codeDraft).then(function(){toast('Kode disalin')},function(err){toast(err.message)});break;
      case 'sync-up':runSync(syncUp);break;
      case 'sync-down':runSync(syncDown);break;
      case 'export':doExport();break;
      case 'import':{const fi=$('#f-import');if(fi)fi.click();break}
    }
    return;
  }
  const cmd=e.target.closest('[data-cmd]');
  if(cmd){
    const ed=$('#editor');
    if(!ed)return;
    ed.focus();
    document.execCommand(cmd.dataset.cmd,false,null);
    ui.dirty=true;
  }
});

document.addEventListener('mousedown',function(e){
  if(e.target.closest('#toolbar button'))e.preventDefault();
});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[role=button]')){e.preventDefault();e.target.click();return}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('.gt input:not([type=checkbox]),.gtitle')){e.preventDefault();e.target.blur()}
});

document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='f-text'&&ui.sheet)ui.sheet.text=t.value;
  else if(t.id==='f-points'&&ui.sheet)ui.sheet.points=t.value;
  else if(t.id==='f-code')ui.codeDraft=t.value;
  else if(t.id==='f-gsearch')filterPick(t.value);
  else if(t.id==='editor'){ui.dirty=true;convertFonts()}
  else if(t.id==='tb-color'){
    restoreSel();
    document.execCommand('styleWithCSS',false,true);
    document.execCommand('foreColor',false,t.value);
    document.execCommand('styleWithCSS',false,false);
    const i=t.parentNode.querySelector('i');if(i)i.style.background=t.value;
    ui.dirty=true;
  }
});
document.addEventListener('change',function(e){
  if(gymChange(e.target))return;
  if(e.target.id==='tb-size'){
    ui.sizePx=+e.target.value;
    restoreSel();
    document.execCommand('styleWithCSS',false,false);
    document.execCommand('fontSize',false,'7');
    convertFonts();
    ui.dirty=true;
  }else if(e.target.id==='f-import'){
    const f=e.target.files&&e.target.files[0];
    if(f)doImport(f);
    e.target.value='';
  }
});

window.addEventListener('pagehide',flushJournal);
document.addEventListener('visibilitychange',function(){
  if(document.hidden)flushJournal();
  else if(rollover()&&route()!=='journal/edit')render();
});
setInterval(function(){if(rollover()&&route()!=='journal/edit'&&!ui.busy)render()},30000);

/* ---------- Mulai ---------- */
rollover();
save();
render();
})();
